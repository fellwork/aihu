<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aihu + Tailwind — CSS Pluggability Example</title>
    <link rel="stylesheet" href="/dist/tailwind.css" />
  </head>
  <body class="min-h-screen bg-slate-100 p-8">
    <div class="mx-auto max-w-2xl space-y-6">
      <h1 class="text-3xl font-bold text-slate-900">aihu + Tailwind</h1>
      <p class="text-slate-600">
        Two aihu SFCs styled with Tailwind utility classes. The components
        are registered as light-DOM custom elements
        (<code class="rounded bg-slate-200 px-1 py-0.5 text-sm">shadowMode: 'none'</code>)
        so the global Tailwind stylesheet reaches them through the cascade.
      </p>

      <pluggable-card></pluggable-card>
      <pluggable-button></pluggable-button>
    </div>

    <script type="module" src="/dist/main.js"></script>
  </body>
</html>
