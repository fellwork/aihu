name: Deploy aihu-docs

# Deploys apps/docs to Cloudflare Pages (project: aihu-docs).
#
# Production deploy: push to main → branch "main" → aihu.dev
# Preview deploy:    pull_request  → branch name   → <branch>.aihu-docs.pages.dev
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID

"on":
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      - 'packages/arbor/**'
      - 'packages/compiler/**'
      - 'packages/agent-readiness/**'
      - 'packages/server/**'
      - 'docs/site/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/arbor/**'
      - 'packages/compiler/**'
      - 'packages/agent-readiness/**'
      - 'packages/server/**'
      - 'docs/site/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  RUSTUP_TOOLCHAIN: "1.88"

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8
        with:
          toolchain: "1.88"

      - name: Cache Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/compiler/target
          key: rust-${{ runner.os }}-${{ hashFiles('packages/compiler/Cargo.lock', 'packages/compiler/src/**') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
        env:
          CARGO_TERM_COLOR: always

      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          cp packages/compiler/target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          SCRIBE_SKIP_POSTINSTALL: "1"

      - name: Build docs
        run: bun run build
        working-directory: apps/docs

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name aihu-docs --branch ${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}'
            if (!url) return
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📄 Docs preview: ${url}`,
            })
