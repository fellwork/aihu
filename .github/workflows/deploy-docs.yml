name: Deploy aihu-docs

# Deploys apps/docs to Cloudflare Pages (project: aihu-docs).
#
# Production deploy: push to main → branch "main" → aihu.dev
# Preview deploy:    pull_request  → branch name   → <branch>.aihu-docs.pages.dev
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID

# WHEN THIS RUNS — and why it is narrower than it used to be.
#
# The deployed docs consume the PUBLISHED `@aihu/compiler-<platform>` binary,
# not the one built from the checkout (see `resolveCompilerBinary()` in
# packages/compiler/js/resolve-binary.ts — the published per-platform package is
# resolved BEFORE any locally staged binary). So rebuilding docs on every PR
# that touched packages/compiler/** told us nothing about that PR: it recompiled
# the docs with the already-published compiler and burned ~12 minutes doing it.
#
# The docs therefore only need to rebuild when one of three things changes:
#   1. the docs themselves (apps/docs/**),
#   2. a package apps/docs imports FROM SOURCE (see the path list below), or
#   3. the published compiler — i.e. a release actually shipped new binaries.
#
# (3) is handled by `workflow_run` on the release workflow rather than by
# source-path filters, so it fires when a version is genuinely published, not
# when a version-bump commit happens to touch packages/compiler/.
#
# `packages/arbor/**` was dropped from the old list: apps/docs consumes arbor
# through normal package resolution, not a source import, so an arbor change
# reaches the docs only once it is built and published — the same reasoning
# that applies to the compiler binary.
#
# A compiler PR that DOES want to prove it hasn't broken the docs opts in with
# `workflow_dispatch` against its branch (gh workflow run "Deploy aihu-docs"
# --ref <branch>). Note a `docs-check` PR label CANNOT work here: GitHub applies
# the `paths` filter to every pull_request activity type, so a label event on a
# compiler-only PR never matches and would silently never fire.
#
# Every run now builds the docs with AIHU_COMPILE_BIN pointed at the checkout's
# freshly built compiler, so when it does run it exercises this tree's compiler
# rather than the published one.
"on":
  push:
    branches:
      - main
    paths:
      - 'apps/docs/**'
      # Packages apps/docs imports FROM SOURCE (not via a published dist), so a
      # change to them really does change the docs build output:
      #   build.ts            -> packages/server/src/{head-lowering,ssr}.ts
      #   build.ts            -> packages/plugin-agent-readiness/src/sitemap.ts
      #   build.ts            -> packages/plugin-kindly-note/src/render-markdown.ts
      #   rolldown.config.ts  -> packages/compiler/js/index.ts
      - 'packages/server/**'
      - 'packages/plugin-agent-readiness/**'
      - 'packages/plugin-kindly-note/**'
      # ONLY the JS plugin, deliberately not packages/compiler/**. The Rust
      # crate compiles to a binary the docs consume from the PUBLISHED
      # per-platform package, so Rust-source edits, Cargo changes, and
      # version-bump commits cannot affect this build and must not trigger it.
      - 'packages/compiler/js/**'
      - '.github/workflows/deploy-docs.yml'
  pull_request:
    paths:
      - 'apps/docs/**'
      # Packages apps/docs imports FROM SOURCE (not via a published dist), so a
      # change to them really does change the docs build output:
      #   build.ts            -> packages/server/src/{head-lowering,ssr}.ts
      #   build.ts            -> packages/plugin-agent-readiness/src/sitemap.ts
      #   build.ts            -> packages/plugin-kindly-note/src/render-markdown.ts
      #   rolldown.config.ts  -> packages/compiler/js/index.ts
      - 'packages/server/**'
      - 'packages/plugin-agent-readiness/**'
      - 'packages/plugin-kindly-note/**'
      # ONLY the JS plugin, deliberately not packages/compiler/**. The Rust
      # crate compiles to a binary the docs consume from the PUBLISHED
      # per-platform package, so Rust-source edits, Cargo changes, and
      # version-bump commits cannot affect this build and must not trigger it.
      - 'packages/compiler/js/**'
      - '.github/workflows/deploy-docs.yml'
  # A release published new compiler binaries — rebuild the docs against them.
  workflow_run:
    workflows: ["Release aihu-compile binaries"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

env:
  # W2: oxc_parser 0.139 needs rustc >= 1.94; keep in sync with rust-toolchain.toml.
  RUSTUP_TOOLCHAIN: "1.95"

jobs:
  test:
    name: Smoke tests
    runs-on: ubuntu-22.04
    # On the workflow_run trigger, only proceed when the release actually
    # succeeded — a failed release published nothing, so there is no new
    # compiler to rebuild the docs against. Every other trigger runs normally.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8
        with:
          toolchain: "1.95" # W2: oxc_parser 0.139 needs rustc >= 1.94; sync with rust-toolchain.toml
          # wasm32: the docs prebuild builds the playground WASM from the
          # WORKSPACE compiler (scripts/build-wasm-bundle.ts) so the playground
          # grammar always matches the checkout — the old release-fetch served
          # a stale grammar and broke every preset with C306 (#491).
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # MUST build aihu-compile fresh from current source so docs are compiled
      # with the latest @style emission. The old actions/cache (restore-keys
      # prefix fallback) would restore a stale packages/compiler/target with an
      # old binary that cargo would not refresh (mtime trap) — building docs
      # with a compiler that PREDATES the @style backtick-escape fix (#312).
      # docs-shell's @style contains a backtick (the `.kn` selector comment), so
      # a stale compiler emits an unescaped `replaceSync(`…`)` template literal
      # → customElements.define('docs-shell') throws → hydration never happens →
      # the e2e waitForFunction times out. Swatinem/rust-cache cleans the local
      # workspace crate (aihu-compile) before save, so it always rebuilds.
      - name: Cache Rust build (deps only; aihu-compile always rebuilds)
        uses: Swatinem/rust-cache@v2

      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
        env:
          CARGO_TERM_COLOR: always

      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          # packages/compiler is a root-workspace member, so the binary lands in
          # the workspace-root target/, not packages/compiler/target/.
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"

      # Doc-coverage gate (default/non-strict): hard-fails on undocumented
      # A1-owned packages; A3/A4 doc gaps are a tracked WARNING (exit 0) so an
      # A1 docs deploy is not blocked on other tracks. A3/A4 closeout PRs run
      # this with --strict to block their own landing on missing docs.
      #
      # Runs BEFORE the docs build: it only reads source + manifest text, so it
      # is cheap, and running it first fails fast. It used to sit between the
      # build and the Playwright run, where a hard-fail silently masked every
      # downstream test — that is how 13 broken Playwright specs went unnoticed
      # for two days while the gate was red for an unrelated reason.
      - name: Doc-coverage gate
        run: bun apps/docs/scripts/check-doc-coverage.ts

      # AIHU_COMPILE_BIN: without it `resolveCompilerBinary()` prefers the
      # PUBLISHED @aihu/compiler-<platform> package over the binary staged
      # above, so this job would build the docs with the released compiler and
      # quietly fail to test the checkout at all. The staging step, the artifact
      # upload, and the deploy job's download all exist to use this binary —
      # this is what actually makes them take effect.
      - name: Build docs
        run: bun run build
        working-directory: apps/docs
        env:
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright Chromium
        run: bunx playwright install --with-deps chromium
        working-directory: apps/docs

      - name: Run smoke tests
        run: bunx playwright test --reporter=line
        working-directory: apps/docs

      # Lighthouse quality gate — serves apps/docs/dist (wrangler pages dev) and
      # asserts 95+ on perf/a11y/best-practices/SEO + CWV for /docs/introduction.
      # Lives in the always-run `test` job (no Cloudflare secrets needed) so it
      # BLOCKS every PR on a perf regression, independent of the deploy job.
      # Keeps scripts/lighthouse.ts's best-of-3 retry (a temporary stopgap
      # retired separately once CI confirms deterministic perf — see
      # docs/plans/2026-05-29-docs-dogfood-overhaul.md §WS5).
      - name: Lighthouse gate
        run: bun scripts/lighthouse.ts

      - name: Upload Lighthouse results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-results
          path: scripts/lighthouse-results.json
          if-no-files-found: ignore

      - name: Upload compiler binary
        uses: actions/upload-artifact@v4
        with:
          name: aihu-compile-linux-x64
          path: packages/compiler/bin/aihu-compile

      # The docs prebuild (scripts/build-wasm-bundle.ts) built pkg-wasm from
      # the workspace compiler during "Build docs". Hand it to the deploy job
      # (which has no Rust toolchain) — the build stamp inside lets the deploy
      # job's prebuild verify it matches the checkout and reuse it.
      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        with:
          name: aihu-compile-wasm-pkg
          path: packages/compiler/pkg-wasm

  deploy:
    name: Build & deploy
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download compiler binary
        uses: actions/download-artifact@v4
        with:
          name: aihu-compile-linux-x64
          path: packages/compiler/bin

      - run: chmod 0755 packages/compiler/bin/aihu-compile

      # Reuse the test job's workspace-built WASM bundle: this job installs no
      # Rust toolchain, and scripts/build-wasm-bundle.ts verifies the bundle's
      # build stamp against the checkout before reusing it (same commit → same
      # stamp), so the deployed playground grammar matches the deployed docs.
      - name: Download WASM bundle
        uses: actions/download-artifact@v4
        with:
          name: aihu-compile-wasm-pkg
          path: packages/compiler/pkg-wasm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"

      # Same reasoning as the test job: the binary downloaded from the artifact
      # above is only actually used if AIHU_COMPILE_BIN points at it. Without
      # this the deploy would ship docs compiled by the published binary,
      # silently discarding the download.
      - name: Build docs
        run: bun run build
        working-directory: apps/docs
        env:
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      # The Lighthouse quality gate runs in the always-on `test` job (above),
      # which this deploy job `needs:` — so a perf regression already blocks the
      # pipeline before deploy. No need to re-run it here.

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs/dist --project-name aihu-docs --branch ${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}'
            if (!url) return
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📄 Docs preview: ${url}`,
            })
