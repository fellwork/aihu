name: Changesets release PR

# Opens / updates a "Release PR" whenever a `.changeset/*.md` lands on main.
# Merging that Release PR commits the version bumps + per-package CHANGELOGs.
# It does NOT tag or publish — this workflow has no publish step. To ship, a
# maintainer then pushes a `v*` tag manually (see docs/RELEASING.md), which
# triggers `release.yml` to build binaries + WASM and publish all tier
# A/B/C/D `@aihu/*` packages to npm.
#
# This is the standard Changesets release flow; do not publish from this
# workflow. Tag-driven publish lives in `release.yml`.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      # Mint a GitHub App installation token. This is NOT a tidy-up.
      #
      # A PR opened with the default `secrets.GITHUB_TOKEN` does NOT trigger
      # workflows — GitHub suppresses events raised by GITHUB_TOKEN to prevent
      # recursion. So every Release PR this workflow has ever opened reported
      # ZERO check-runs, `ci-ok` never appeared, and the PR was permanently
      # unmergeable under branch protection. The observed workaround was
      # `enforce_admins=false`, which weakened protection for EVERY PR and every
      # admin push, repo-wide, to route around a defect on one branch — leaving
      # the one PR that leads to an npm publish as the only PR CI never built.
      # See FEL-429.
      #
      # An App token is a real actor, so the PR it opens DOES trigger workflows.
      # Unlike a PAT it does not expire and is not tied to one person's account;
      # a silently-expired PAT would reintroduce exactly this bug, invisibly.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # BOTH the checkout token and the changesets `env` below must carry the
      # App token. The `env` covers the PR-creation API call; this one
      # authenticates the git remote so the branch PUSH is attributed to the App
      # too. Setting only one is the common half-fix: the PR appears, and still
      # gets no CI.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Open / update Release PR
        uses: changesets/action@v1
        with:
          # Compound version step, run via the `release:version` package script:
          #   1. changeset version  — bump package.json + write CHANGELOGs
          #   2. bun install        — refresh bun.lock for the bumped versions
          #                            (avoids CI's --frozen-lockfile mismatch on
          #                             the release tag's downstream workflow)
          #   3. sync-readme.ts     — regenerate autogen sections of root README,
          #                            per-package READMEs, and the package
          #                            inventory cache. Without this, every
          #                            Release-PR ships drift that downstream
          #                            CI's sync-readme --check would flag.
          # MUST be a single command: changesets/action runs the `version` input
          # as one command (it does NOT shell-chain a multi-line block — a `|`
          # block collapses to space-joined args and `changeset version` then
          # rejects them as "too many arguments"). So the chaining lives inside
          # the `release:version` npm script (`&&`-separated), invoked here.
          # changesets/action commits whatever is in the working tree after it.
          version: bun run release:version
          # No `publish` script here — actual publishing happens on tag push
          # via release.yml, gated on the binary builds completing first.
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          # App token, NOT secrets.GITHUB_TOKEN — see the comment on the
          # create-github-app-token step. This is the line that decides whether
          # the Release PR gets CI at all.
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Prevent husky pre-push hook from running on the CI runner — moon
          # and other dev tools are not available in this minimal workflow.
          HUSKY: '0'
