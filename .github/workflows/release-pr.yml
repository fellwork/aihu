name: Changesets release PR

# Opens / updates a "Release PR" whenever a `.changeset/*.md` lands on main.
# Merging that Release PR commits the version bumps and creates a `v*` tag,
# which then triggers `release.yml` to build binaries + WASM and publish all
# tier A/B/C/D `@aihu/*` packages to npm.
#
# This is the standard Changesets release flow; do not publish from this
# workflow. Tag-driven publish lives in `release.yml`.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-pr:
    name: Open release PR
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - name: Open / update Release PR
        uses: changesets/action@v1
        with:
          # Compound version step:
          #   1. changeset version  — bump package.json + write CHANGELOGs
          #   2. bun install        — refresh bun.lock for the bumped versions
          #                            (avoids CI's --frozen-lockfile mismatch on
          #                             the release tag's downstream workflow)
          #   3. sync-readme.ts     — regenerate autogen sections of root README,
          #                            per-package READMEs, and the package
          #                            inventory cache. Without this, every
          #                            Release-PR ships drift that downstream
          #                            CI's sync-readme --check would flag.
          # changesets/action commits whatever is in the working tree after
          # the version step.
          version: |
            bun changeset version
            bun install
            bun scripts/sync-readme.ts
          # No `publish` script here — actual publishing happens on tag push
          # via release.yml, gated on the binary builds completing first.
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Prevent husky pre-push hook from running on the CI runner — moon
          # and other dev tools are not available in this minimal workflow.
          HUSKY: '0'
