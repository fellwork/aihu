name: Deploy aihu-docs-next

# Deploys apps/docs-next to Cloudflare Pages (project: aihu-docs-next) —
# SEPARATE from the live aihu-docs project (deploy-docs.yml / aihu.dev), so
# this deploy is zero-risk to the production site.
#
# Production deploy: push to main → branch "main" → aihu-docs-next.pages.dev
#   (or the project's configured production domain)
# Preview deploy:    pull_request  → branch name   → <branch>.aihu-docs-next.pages.dev
#
# Required repository secrets (reused from deploy-docs.yml — same Cloudflare
# account, different Pages project):
#   CLOUDFLARE_API_TOKEN   — CF API token with Pages:Edit permission
#   CLOUDFLARE_ACCOUNT_ID  — Cloudflare account ID

"on":
  push:
    branches:
      - main
    paths:
      - 'apps/docs-next/**'
      - '.github/workflows/deploy-docs-next.yml'
  pull_request:
    paths:
      - 'apps/docs-next/**'
      - '.github/workflows/deploy-docs-next.yml'
  workflow_dispatch:

permissions:
  contents: read
  deployments: write
  pull-requests: write

jobs:
  deploy:
    name: Build & deploy
    # Dependabot PRs run with GITHUB_TOKEN only — repo Actions secrets (incl.
    # CLOUDFLARE_API_TOKEN) are deliberately withheld by GitHub for security,
    # a separate store from regular repo secrets (Settings > Secrets >
    # Dependabot). Deploying THAT would mean any dependency-bump PR carries
    # real Cloudflare deploy credentials — not a tradeoff to make for an
    # actions-version bump that touches no app code. This is docs-next's ONLY
    # job (build+deploy combined, unlike deploy-docs.yml's separate `test`),
    # so skipping it loses the build-verification signal too for Dependabot
    # PRs specifically; acceptable for the same reason.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so `moon run :build` can resolve `main` + the merge-base
          # to compute affected packages. A shallow checkout makes moon's git
          # diff fail with "fatal: ambiguous argument 'main'" (exit 128).
          fetch-depth: 0

      # docs-next dogfoods @aihu/app + vite SSG, which resolves every @aihu/*
      # workspace import through package.json `exports` → dist/*. Unlike
      # apps/docs (its own bespoke build.ts), there is no bundler-level
      # source-alias fallback here — the workspace packages' dist/ must exist
      # on disk before `vite build` runs, so this job builds the whole
      # packages/* graph first (mirrors the `examples` / `governed-examples`
      # jobs in plan-a.yml, the closest existing precedent for an apps/*
      # build that depends on built workspace packages).
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      # aihu-compile (the .aihu SFC compiler) is a native Rust binary. docs-next
      # has no WASM playground (deferred — see apps/docs-next's cookbook commit),
      # so unlike deploy-docs.yml this job needs no wasm32 target / wasm-pack,
      # only the native release binary for the vite-plugin compiler pass.
      - name: Cache Rust build (deps only; aihu-compile always rebuilds)
        uses: Swatinem/rust-cache@v2

      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
        env:
          CARGO_TERM_COLOR: always

      # aihu-css-compile (the css-engine's native CSS compiler) is the SECOND
      # native binary this job needs, and unlike aihu-compile above it was never
      # built here — docs-next's `prebuild` → `gen:css` → `compile()` calls it
      # directly (apps/docs-next/gen-css.ts), and the vite plugin's compileSfc()
      # pass calls it again. deploy-docs.yml gets away without this step because
      # apps/docs has no gen:css and never touches @aihu/css-engine at build time.
      #
      # Until now this job resolved the binary from the PUBLISHED
      # @aihu/css-engine-<platform> optionalDependency instead. That is a silent
      # single point of failure: optionalDependencies are dropped WITHOUT error
      # when unresolvable, so the moment packages/css-engine/package.json pinned
      # a version that had not been published yet (0.1.4 in #725, then 0.1.17),
      # installs kept "succeeding" and the job died much later with
      # "Native CSS compiler binary not found for this platform" — red since
      # 2026-08-01, green through 2026-07-30 on the last published pin (0.1.3).
      #
      # Building from source removes the coupling to release cadence entirely:
      # resolveBinary() checks target/release/aihu-css-compile as a dev fallback
      # (it is named in that very error message's "Checked dev fallback paths"),
      # so a source build satisfies both call sites and an unpublished pin can
      # never break docs deploys again. Same shape as the compiler step above.
      - name: Build css-engine binary
        run: cargo build --release -p aihu-css-core
        env:
          CARGO_TERM_COLOR: always

      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          # packages/compiler is a root-workspace member, so the binary lands in
          # the workspace-root target/, not packages/compiler/target/.
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.8"

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"

      # Builds every packages/* project (moon run :build) in dependency order:
      # compiler → css-engine/arbor/runtime/signals/... → server/router → app.
      # docs-next's own build only compiles ITS OWN .aihu/.ts sources; it never
      # rebuilds its @aihu/* workspace deps.
      - name: Build workspace packages
        run: bun run build
        env:
          # See the note on the docs-next build step below — same reason.
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      - name: Build docs-next
        # gen:css (prebuild) + vite build → dist. public/ (including the
        # agent-discovery surface: ai.txt, agents.json, openapi.json,
        # .well-known/*) is copied into dist/ by vite as static assets.
        run: bun run build
        working-directory: apps/docs-next
        env:
          # WITHOUT this, the two steps above ("Build compiler binary" / "Stage
          # compiler binary") are dead weight. packages/compiler/js/envelope.ts
          # gates on `AIHU_COMPILER_NATIVE === '0' || AIHU_COMPILE_BIN` — an
          # `||` — so with neither set it loads the PUBLISHED napi addon
          # in-process and never spawns the binary this job just built. A
          # compiler fix would then be invisible to its own CI. This is what hid
          # the TDZ bug in apps/docs; deploy-docs.yml carries the same two hunks.
          AIHU_COMPILE_BIN: ${{ github.workspace }}/packages/compiler/bin/aihu-compile

      - name: Ensure Pages project exists
        # Idempotent: creates aihu-docs-next on first run; continue-on-error lets
        # re-runs pass when it already exists. Pages:Edit on the token covers
        # creation. Separate project from live aihu-docs — never touches aihu.dev.
        continue-on-error: true
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages project create aihu-docs-next --production-branch main

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/docs-next/dist --project-name aihu-docs-next --branch ${{ github.head_ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = '${{ steps.deploy.outputs.deployment-url }}'
            if (!url) return
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `📄 docs-next preview: ${url}`,
            })
