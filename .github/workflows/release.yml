name: Release aihu-compile binaries

# Cross-compile the aihu-compile Rust binary for all supported platforms,
# build the WASM bundle for browser playground use, then publish a GitHub
# Release with all binaries (+ WASM bundle + SHA256 sidecars) attached as assets.
#
# Triggers:
#   - push of any tag matching `v*` (real release)
#   - manual workflow_dispatch with optional `tag` input (dry run; binaries
#     are uploaded as workflow artifacts but no GitHub Release is created
#     unless the input parses as an actual `v*` tag).
#   - manual workflow_dispatch with `canary: true` — CANARY SNAPSHOT release:
#     every publish job first runs `changeset version --snapshot canary`
#     (+ scripts/stamp-platform-snapshot.ts for the native platform packages),
#     producing `0.0.0-canary-<shortsha>` versions, then publishes to the
#     `canary` npm dist-tag so `latest` (and every plain `npm install`) is
#     UNAFFECTED. Consumers pin with `npm install @aihu/app@canary` or the
#     exact snapshot version. `dry_run` defaults to TRUE: the default canary
#     run versions + builds + packs with `npm publish --dry-run` (no network
#     write); a human must explicitly pass dry_run=false to publish for real.
#     The snapshot suffix is the COMMIT hash (.changeset/config.json
#     `snapshot.prereleaseTemplate: "{tag}-{commit}"`), so the independent
#     publish jobs below all compute the IDENTICAL version from the same
#     checked-out SHA — no cross-job version handoff needed. Snapshot bumps
#     are ephemeral (never committed); no GitHub Release and no git tag is
#     created for canaries.
#
# Consumed by:
#   - NOT by a compiler postinstall script. This comment used to name
#     `packages/compiler/js/postinstall.ts` as the consumer that fetched
#     `releases/latest/download/<asset>` and verified the SHA256. That file no
#     longer exists and `packages/compiler` declares no `postinstall` script;
#     the binary now reaches consumers exclusively through the
#     `@aihu/compiler-<platform>` optionalDependencies, resolved by
#     `packages/compiler/js/resolve-binary.ts` — which performs no network
#     fetch at all. The per-platform `aihu-compile-*` assets and their .sha256
#     sidecars are therefore published for out-of-band/manual verification and
#     as a human-fetchable escape hatch, not for an automated install path.
#   - apps/docs/ playground (arch-1 §3.5 + arch-4 §4.6) — FALLBACK ONLY since
#     #491: scripts/build-wasm-bundle.ts builds the WASM from the workspace
#     compiler and fetches `releases/latest/download/aihu-compile-wasm.tar.gz`
#     only when the wasm toolchain is unavailable.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to dry-run the build against (no release created)'
        required: false
        default: ''
      canary:
        description: 'Canary snapshot release: version 0.0.0-canary-<sha> and publish to the `canary` npm dist-tag'
        required: false
        type: boolean
        default: false
      dry_run:
        description: 'Canary only: pack + validate with npm publish --dry-run (no network write). Set to false to publish for real.'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

# Force every `cargo` invocation to resolve toolchain to 1.95 by default.
# The dtolnay/rust-toolchain action installs the version but doesn't always
# rewrite rustup's default; without this env, plain `cargo build` falls back
# to the system default which fails MSRV checks. See PR #68 for the original
# toolchain bump and run 25394476208 for the failure that exposed the
# env-vs-default-toolchain gap. 1.88 → 1.95 (W2 advanced-js-template-
# expressions): oxc_parser 0.139 requires rustc >= 1.94; keep in sync with
# rust-toolchain.toml and deploy-docs.yml.
env:
  RUSTUP_TOOLCHAIN: "1.95.0"

jobs:
  # Lockfile integrity, checked ONCE and checked EARLY.
  #
  # FEL-RELEASE-FROZEN-LOCK. `v0.4.62` published every platform binary and zero
  # JS packages, dying in `publish-packages` on:
  #
  #   error: lockfile had changes, but lockfile is frozen
  #
  # The release had poisoned its own install. The platform pins LEAD their
  # published versions, so when `bun.lock` was last refreshed
  # `@aihu/compiler-darwin-arm64@0.1.54` did not exist on npm; bun cannot
  # resolve an optionalDependency that isn't published, so it OMITS the entry
  # from the lock entirely. The four platform-publish jobs then pushed exactly
  # those versions to npm — and `publish-packages`, which `needs:` all four,
  # installed afterwards, resolved optionalDependencies the lock had never
  # heard of, wanted to add them, and was refused.
  #
  # Reproduced deterministically rather than inferred: delete one platform
  # entry from `bun.lock` and `bun install --frozen-lockfile` emits that exact
  # error, while a plain `bun install` succeeds and re-adds it.
  #
  # `plan-a.yml`'s `AIHU_COMPILER_NATIVE: '0'` comment already predicted the
  # consumer-side half of this — "the platform pins currently lead their
  # published versions, so bun drops the unresolvable optionalDependency…
  # That protection disappears the moment those versions publish." Nobody
  # traced it back into this workflow's own job graph.
  #
  # The fix is not to stop checking. It is to check where the answer is still
  # meaningful: this job has NO `needs:`, so it runs before any job in this
  # workflow can mutate the registry, and `publish-packages` gates on it. The
  # install inside `publish-packages` is now a plain `bun install`, because its
  # purpose is to materialize node_modules for build/pack, not to gate
  # integrity — see the comment there.
  #
  # NOTE the four `bun install --frozen-lockfile --ignore-scripts` calls in the
  # publish-*-native jobs are deliberately left alone: each sits inside a
  # `Snapshot version (canary)` step gated on
  # `github.event_name == 'workflow_dispatch' && inputs.canary`, so none of
  # them runs on a `v*` tag push. In canary mode they are also correct — they
  # install against the committed lock BEFORE `changeset version --snapshot`
  # rewrites versions, and a canary publishes `0.0.0-canary-<sha>`, which never
  # makes a committed `0.1.x` pin newly resolvable.
  lockfile-integrity:
    name: Lockfile integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: bun install --frozen-lockfile
        # --ignore-scripts: this job only answers "does bun.lock agree with the
        # manifests at this SHA". Postinstall scripts are build work, and doing
        # them here would just be a slower way to get the same boolean.
        run: bun install --frozen-lockfile --ignore-scripts

  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: aihu-compile-darwin-arm64
            ext: ''
            use_cross: false
          # x86_64 darwin built on macos-14 (Apple Silicon) via cross-target.
          # macos-13 reached end-of-life 2025-12-04 and was removed from GitHub's
          # hosted-runner pool — jobs requesting `runs-on: macos-13` queue forever.
          # rustup adds the x86_64-apple-darwin stdlib on demand and cargo builds
          # for the requested target; no QEMU/cross needed (LLVM cross-compiles
          # natively for darwin on darwin hosts).
          - runner: macos-14
            target: x86_64-apple-darwin
            asset: aihu-compile-darwin-x64
            ext: ''
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: aihu-compile-linux-x64
            ext: ''
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset: aihu-compile-linux-arm64
            ext: ''
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: aihu-compile-windows-x64.exe
            ext: '.exe'
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.use_cross == true
        # cross v0.2.5 (2023-02-04) — latest stable tag; uses its committed
        # Cargo.lock (--locked) so thiserror stays on v1, avoiding the v1/v2
        # conflict that caused the previous git-rev pin (4090beca) to fail.
        # Commit: 88f49ff79e777bef6d3564531636ee4d3cc2f8d2
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build release binary (cargo)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact
          # Workspace-root target/ — `packages/compiler` is a member of the root
          # Cargo workspace, so cargo emits to ./target, not packages/compiler/target.
          cp target/${{ matrix.target }}/release/aihu-compile artifact/${{ matrix.asset }}
          chmod 0755 artifact/${{ matrix.asset }}
          # SHA256 sidecar, for out-of-band verification of the Release asset.
          #
          # macOS runners ship `shasum`, NOT `sha256sum`, and the darwin targets
          # in this matrix build on macOS. The previous one-liner
          #
          #   sha256sum "$asset" | awk '{print $1}' > "$asset.sha256"
          #
          # failed there in the quietest possible way. A pipeline's exit status
          # is its LAST command's, so `awk` returning 0 meant `set -e` never
          # fired on the missing `sha256sum`; the redirect still created the
          # sidecar, empty; `if-no-files-found: error` saw a file and was
          # satisfied; and the flatten step below skipped it as empty. Result:
          # every darwin release shipped with no checksum while CI stayed green.
          # v0.4.61 is the release where that was finally noticed.
          #
          # So: pick the tool that exists, keep the digest out of a pipeline's
          # exit status, and assert it is non-empty before writing.
          asset="artifact/${{ matrix.asset }}"
          if command -v sha256sum >/dev/null 2>&1; then
            digest="$(sha256sum "$asset" | awk '{print $1}')"
          elif command -v shasum >/dev/null 2>&1; then
            digest="$(shasum -a 256 "$asset" | awk '{print $1}')"
          else
            echo "::error::neither sha256sum nor shasum is available on $(uname -s) — cannot checksum ${{ matrix.asset }}"
            exit 1
          fi
          if [ -z "$digest" ]; then
            echo "::error::computed an empty SHA256 for ${{ matrix.asset }}"
            exit 1
          fi
          # No trailing newline, matching the Windows step's -NoNewline.
          printf '%s' "$digest" > "$asset.sha256"
          echo "Generated SHA256: $digest"

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          # Workspace-root target/ — see the Unix stage step above.
          Copy-Item -Path "target/${{ matrix.target }}/release/aihu-compile.exe" -Destination "artifact/${{ matrix.asset }}"
          # SHA256 sidecar, for out-of-band verification (see the header note —
          # there is no postinstall consumer). PowerShell's Get-FileHash has no
          # equivalent of the Unix side's missing-tool trap.
          $hash = (Get-FileHash -Algorithm SHA256 "artifact/${{ matrix.asset }}").Hash.ToLower()
          $hash | Out-File -FilePath "artifact/${{ matrix.asset }}.sha256" -Encoding ascii -NoNewline
          Write-Host "Generated SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            artifact/${{ matrix.asset }}
            artifact/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    name: Build aihu-compile-wasm bundle
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    # WASM bundle for browser-side compilation in the homepage playground
    # (Directive 1 + arch-4 §4.6). Output is a tar.gz of the wasm-pack `pkg-wasm/`
    # directory so consumers receive the full glue (.wasm + .js + .d.ts + package.json).
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM bundle
        run: |
          cd packages/compiler
          wasm-pack build --target web --out-dir pkg-wasm
          ls -la pkg-wasm/

      - name: Stage WASM bundle
        run: |
          mkdir -p artifact
          tar -czf artifact/aihu-compile-wasm.tar.gz -C packages/compiler pkg-wasm
          # SHA256 sidecar
          sha256sum artifact/aihu-compile-wasm.tar.gz | awk '{print $1}' > artifact/aihu-compile-wasm.tar.gz.sha256
          # Size gate — W2 (advanced-js-template-expressions) turned the old
          # non-fatal warning into a HARD assert: embedding oxc_parser spends
          # a deliberate chunk of the budget (see packages/compiler/WASM.md
          # for the measured numbers), so regressions past 500 KB gzip must
          # fail the build, not warn (arch-4 §4.6 / Directive 1).
          raw=$(stat -c %s artifact/aihu-compile-wasm.tar.gz)
          gz_wasm=$(gzip -9 -c packages/compiler/pkg-wasm/aihu_compiler_bg.wasm | wc -c)
          echo "Tar.gz bundle size: $raw bytes"
          echo "Raw .wasm gzipped:  $gz_wasm bytes (budget <500KB = 512000)"
          if [ "$gz_wasm" -gt 512000 ]; then
            echo "::error::WASM gzipped size $gz_wasm exceeds the 500KB budget (arch-4 §4.6 / WASM.md)"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aihu-compile-wasm
          path: |
            artifact/aihu-compile-wasm.tar.gz
            artifact/aihu-compile-wasm.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    # Downloads EVERY run artifact (no `name:` filter, below) regardless of
    # which job produced it, so it must wait on every job that uploads one —
    # not just build/build-wasm. Missing build-native/build-css-native/
    # build-compiler-napi here let this job start while they were still
    # running, racing the artifact set the flatten step now asserts is
    # complete.
    needs: [build, build-wasm, build-native, build-css-native, build-compiler-napi]
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Only create a Release when triggered by an actual tag push. The
    # workflow_dispatch dry-run path stops after build/build-wasm; binaries
    # are available as workflow artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # Skip 0-byte files. The GitHub Release Asset API rejects empty
          # uploads with "size must be greater than or equal to 1"; a single
          # empty sidecar (typically from a partial-failed prior run that
          # downloaded an artifact for re-upload) would tank the whole
          # release-create step.
          #
          # download-artifact@v4 (no `name:` filter, above) lays every run's
          # artifacts out as artifacts/<artifact-name>/<original-basename> —
          # the <artifact-name> segment is unique per upload-artifact step
          # (aihu-compile-<platform>, aihu-compile-wasm, native-<platform>,
          # css-native-<platform>, compiler-napi-<platform>), but not every
          # basename is: every css-native-<platform> artifact (except win32,
          # which is the differently-named aihu-css-compile.exe) contains a
          # file literally named aihu-css-compile. A bare
          # `cp {} release-assets/` collapses all three onto one path — last
          # write wins, no error — which is exactly how the css binary in a
          # past Release ended up advertising a nondeterministic platform.
          #
          # Fix: copy under the plain basename when nothing has claimed it
          # yet (preserves today's exact asset names for aihu-compile-wasm.*
          # and aihu-compile-<platform>.* — both are consumed by a hardcoded
          # `releases/latest/download/<name>` URL elsewhere in this repo, so
          # THOSE must never move). Only on an actual collision, fall back to
          # an artifact-directory-qualified name, so a second file with the
          # same basename still ships instead of silently vanishing.
          while IFS= read -r f; do
            dir="$(dirname "$f")"
            artifact_name="$(basename "$dir")"
            base="$(basename "$f")"
            dest="release-assets/$base"
            if [ -e "$dest" ]; then
              dest="release-assets/${artifact_name}-${base}"
              if [ -e "$dest" ]; then
                echo "::error::asset name collision even after qualifying with the artifact directory: $dest (from $f)"
                exit 1
              fi
              echo "note: $f basename '$base' collides with an already-staged asset — staging as $(basename "$dest") instead"
            fi
            cp "$f" "$dest"
          done < <(find artifacts -type f ! -empty | sort)
          ls -la release-assets/
          # An empty artifact file means a producer step failed silently — it
          # wrote a redirect target but never filled it. Skipping those (which
          # the `! -empty` filter above does) is what let the darwin .sha256
          # sidecars vanish from every release without one job going red. The
          # filter stays, because a zero-byte asset is genuinely not shippable;
          # what changes is that it is now an ERROR rather than a silent drop.
          empty_files="$(find artifacts -type f -empty | sort)"
          if [ -n "$empty_files" ]; then
            echo "::error::empty artifact file(s) — the step that produced each one failed without failing the job:"
            echo "$empty_files" | sed 's/^/  /'
            exit 1
          fi
          # Sanity count: one asset per upload-artifact step is expected at
          # minimum (some, like aihu-compile-<platform>, upload 2 — binary +
          # .sha256). A run with fewer files than artifact directories means
          # something silently produced nothing, not that everything is fine.
          artifact_dirs=$(find artifacts -mindepth 1 -maxdepth 1 -type d | wc -l | tr -d ' ')
          staged=$(find release-assets -type f | wc -l | tr -d ' ')
          echo "staged $staged release asset(s) from $artifact_dirs artifact director(y/ies)"
          if [ "$staged" -lt "$artifact_dirs" ]; then
            echo "::error::staged fewer release assets ($staged) than artifact directories ($artifact_dirs) — at least one artifact directory contributed nothing"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v2.2.1
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # @aihu/server native renderer (napi-rs Rust addon).
  #
  # Parity-gate paths (AC-15, spec-server-native.md §4.4): the parity gate
  # triggers on PRs touching
  #   - packages/server/src/ssr.ts
  #   - packages/server/src-native/**
  # The build-native job below builds the addon for the runner's platform; the
  # parity test (packages/server/tests/native-parity.test.ts) then runs against
  # the freshly-built binary. No env-var gate is needed — on a supported
  # platform a missing binary throws via the loader (AC-9, spec §5.1), so CI
  # without the addon is automatically a hard fail. The PR-time enforcement
  # lives in the per-PR CI workflow's `check` job (.github/workflows/plan-a.yml
  # — its `bun run test` step picks this up like any other *.test.ts file,
  # with no dedicated named step) or moon's local CI gate; this release
  # workflow builds and publishes the per-platform .node binaries that ship as
  # @aihu/server-<platform> packages.
  # ---------------------------------------------------------------------------
  build-native:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            node-file: server-native.darwin-arm64.node
            cdylib: libaihu_server_native.dylib
          # x86_64 darwin native addon: cross-target on macos-14 (see build matrix
          # above — macos-13 EOL'd 2025-12-04). napi-rs cross-targets cleanly when
          # rustup has the x86_64-apple-darwin stdlib installed.
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            node-file: server-native.darwin-x64.node
            cdylib: libaihu_server_native.dylib
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            node-file: server-native.linux-x64-gnu.node
            cdylib: libaihu_server_native.so
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            node-file: server-native.win32-x64-msvc.node
            cdylib: aihu_server_native.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/server/src-native/Cargo.toml

      - name: Stage .node file (Unix)
        if: runner.os != 'Windows'
        run: |
          cp packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} ${{ matrix.node-file }}

      - name: Stage .node file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" -Destination "${{ matrix.node-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.node-file }}
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish @aihu/server-* platform packages
    needs: build-native
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Tag push (stable) OR canary workflow_dispatch. On a plain dispatch
    # (canary=false) this job still skips, preserving the old dry-run-build
    # behavior of the `tag` input path.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun (canary)
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Snapshot version (canary)
        # Ephemeral 0.0.0-canary-<sha> versions — computed identically in every
        # canary publish job from the same SHA (snapshot.prereleaseTemplate is
        # "{tag}-{commit}"). stamp-platform-snapshot.ts then syncs the non-
        # workspace packages/*/npm/* platform packages + host optionalDependencies
        # pins to the same snapshot version.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          # @changesets/changelog-github requires a token even for snapshot
          # changelog assembly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun scripts/stamp-platform-snapshot.ts

      - name: Download all native artifacts
        uses: actions/download-artifact@v8
        with:
          path: native-artifacts

      - name: Stage and publish each platform package (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          # Canary → publish under the `canary` dist-tag (latest untouched);
          # dry-run canary → pack + validate only, no network write.
          NPM_EXTRA=""
          if [ -n "${CANARY:-}" ]; then NPM_EXTRA="--tag canary"; fi
          if [ -n "${CANARY_DRY_RUN:-}" ]; then NPM_EXTRA="$NPM_EXTRA --dry-run"; fi
          for dir in packages/server/npm/*/; do
            platform=$(basename "$dir")
            node_file=$(ls native-artifacts/native-$platform/*.node 2>/dev/null || true)
            # HARD FAIL, not silent skip: a missing binary here would publish
            # an empty platform package and brick install resolution for that
            # platform (see publish-compiler-native's comment on why this
            # loop's OWN prior silent-skip shape was the anti-pattern).
            if [ -z "$node_file" ]; then
              echo "::error::no .node artifact for $platform (expected native-artifacts/native-$platform/*.node)"
              exit 1
            fi
            dest="$dir/$(basename "$node_file")"
            cp "$node_file" "$dest"
            # NOTE: unlike publish-css-native, we intentionally do NOT chmod 0755
            # here. .node files are dlopen()'d by Node/Bun, not exec()'d — the
            # OS loader does not require the exec bit. actions/download-artifact@v8
            # drops POSIX mode bits, but the resulting -rw-r--r-- is harmless for
            # napi addons. Do not change this without re-verifying dlopen on all
            # 4 platforms.
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: 'npm view <pkg>@<ver>' returns the version string when
            # already published, empty string otherwise. Skip publish on hit so
            # release workflow re-runs (post-fix retag) don't 403 on the fixed
            # platform-publish step and skip-block downstream workspace publish.
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public $NPM_EXTRA )
          done

  # ---------------------------------------------------------------------------
  # @aihu/css-engine native CLI binary (aihu-css-compile, from the aihu-css-core
  # crate). Unlike @aihu/server's napi `.node` addon, css-engine invokes the
  # binary as a CLI SUBPROCESS — so the per-platform packages ship a raw
  # executable, and resolveBinary() (packages/css-engine/src/index.ts) resolves
  # its path via the optionalDependency package. Same 4 platforms as the server
  # native matrix. The dev/monorepo path uses the workspace `target/` fallback.
  # ---------------------------------------------------------------------------
  build-css-native:
    name: Build css-engine ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            bin-file: aihu-css-compile
            ext: ''
          # x86_64 darwin cross-target on macos-14 (macos-13 EOL'd 2025-12-04;
          # LLVM cross-compiles darwin-on-darwin natively with the stdlib added).
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            bin-file: aihu-css-compile
            ext: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            bin-file: aihu-css-compile
            ext: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            bin-file: aihu-css-compile.exe
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Build release binary (cargo)
        # aihu-css-core is a member of the root Cargo workspace; cargo emits the
        # `aihu-css-compile` [[bin]] to the workspace-root ./target.
        run: cargo build --release --target ${{ matrix.target }} -p aihu-css-core --bin aihu-css-compile

      - name: Stage binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.bin-file }} ${{ matrix.bin-file }}
          chmod 0755 ${{ matrix.bin-file }}

      - name: Stage binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "target/${{ matrix.target }}/release/${{ matrix.bin-file }}" -Destination "${{ matrix.bin-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: css-native-${{ matrix.platform }}
          path: ${{ matrix.bin-file }}
          if-no-files-found: error
          retention-days: 7

  publish-css-native:
    name: Publish @aihu/css-engine-* platform packages
    needs: build-css-native
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Tag push (stable) OR canary workflow_dispatch (see publish-native).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun (canary)
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Snapshot version (canary)
        # See publish-native's snapshot step — identical, deterministic per SHA.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          # @changesets/changelog-github requires a token even for snapshot
          # changelog assembly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun scripts/stamp-platform-snapshot.ts

      - name: Download all css-native artifacts
        uses: actions/download-artifact@v8
        with:
          path: css-native-artifacts

      - name: Stage and publish each platform package (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          # Canary dist-tag / dry-run flags (see publish-native).
          NPM_EXTRA=""
          if [ -n "${CANARY:-}" ]; then NPM_EXTRA="--tag canary"; fi
          if [ -n "${CANARY_DRY_RUN:-}" ]; then NPM_EXTRA="$NPM_EXTRA --dry-run"; fi
          for dir in packages/css-engine/npm/*/; do
            platform=$(basename "$dir")
            # The css binary is a raw executable named aihu-css-compile[.exe];
            # match either to be platform-agnostic in the copy.
            bin_file=$(ls css-native-artifacts/css-native-$platform/aihu-css-compile* 2>/dev/null || true)
            # HARD FAIL, not silent skip: a missing binary here would publish
            # an empty platform package and brick install resolution for that
            # platform (see publish-compiler-native's comment on why this
            # loop's OWN prior silent-skip shape was the anti-pattern).
            if [ -z "$bin_file" ]; then
              echo "::error::no css binary artifact for $platform (expected css-native-artifacts/css-native-$platform/aihu-css-compile*)"
              exit 1
            fi
            dest="$dir/$(basename "$bin_file")"
            cp "$bin_file" "$dest"
            # Restore +x lost in actions/download-artifact@v8 (does NOT preserve
            # POSIX mode bits). Without this, the published tarball ships
            # aihu-css-compile as -rw-r--r--, and Bun consumers cannot fix it
            # (postinstall is blocked by default for untrusted deps). Skip
            # win32-x64-msvc — NTFS has no exec bit, and the publish job runs
            # on Linux anyway so chmod on a .exe is meaningless.
            case "$platform" in
              win32-*) ;;
              *) chmod 0755 "$dest" ;;
            esac
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: skip if this version is already on npm (re-run / retag).
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public $NPM_EXTRA )
          done

  # ---------------------------------------------------------------------------
  # @aihu/compiler native CLI binary (aihu-compile, from the aihu-compile crate).
  # Like @aihu/css-engine, the compiler invokes the binary as a CLI SUBPROCESS —
  # the per-platform packages ship a raw executable, and resolveCompilerBinary()
  # (packages/compiler/js/resolve-binary.ts) + the bin shim
  # (packages/compiler/bin/aihu-compile.mjs) resolve its path via the
  # optionalDependency package. REUSES the existing `build` job's 5
  # aihu-compile-<platform> artifacts (no new build job). The dev/monorepo path
  # uses the workspace `target/` fallback.
  #
  # IMPORTANT: artifact names differ from npm dir names — they are mapped
  # EXPLICITLY below. A missing binary for any of the 5 dirs is a HARD FAIL: a
  # silent skip would publish an empty platform package and brick install
  # resolution for that platform. (publish-native, publish-css-native, and
  # publish-compiler-napi originally silent-skipped instead — fixed to match
  # this job's shape once the pattern was noticed; see their own comments.)
  # ---------------------------------------------------------------------------
  publish-compiler-native:
    name: Publish @aihu/compiler-* platform packages
    needs: build
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Tag push (stable) OR canary workflow_dispatch (see publish-native).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun (canary)
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Snapshot version (canary)
        # See publish-native's snapshot step — identical, deterministic per SHA.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          # @changesets/changelog-github requires a token even for snapshot
          # changelog assembly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun scripts/stamp-platform-snapshot.ts

      - name: Download all compiler binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: compiler-artifacts

      - name: Stage and publish each platform package (idempotent, hard-fail)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          # Canary dist-tag / dry-run flags (see publish-native).
          NPM_EXTRA=""
          if [ -n "${CANARY:-}" ]; then NPM_EXTRA="--tag canary"; fi
          if [ -n "${CANARY_DRY_RUN:-}" ]; then NPM_EXTRA="$NPM_EXTRA --dry-run"; fi
          # Explicit npm-dir → (build artifact name, dest file) map. The `build`
          # job uploads artifacts named aihu-compile-<asset>; download-artifact@v4
          # places each under compiler-artifacts/<artifact-name>/<artifact-name>.
          # Dest file is aihu-compile (or aihu-compile.exe on win32) to match the
          # platform package's `files` entry and the resolver's binFile.
          declare -A ARTIFACT=(
            [darwin-arm64]="aihu-compile-darwin-arm64"
            [darwin-x64]="aihu-compile-darwin-x64"
            [linux-x64-gnu]="aihu-compile-linux-x64"
            [linux-arm64-gnu]="aihu-compile-linux-arm64"
            [win32-x64-msvc]="aihu-compile-windows-x64.exe"
          )
          for dir in packages/compiler/npm/*/; do
            platform=$(basename "$dir")
            artifact="${ARTIFACT[$platform]:-}"
            if [ -z "$artifact" ]; then
              echo "::error::no artifact mapping for platform dir $platform"
              exit 1
            fi
            src="compiler-artifacts/$artifact/$artifact"
            if [ ! -f "$src" ]; then
              echo "::error::expected compiler binary artifact not found: $src (platform $platform)"
              exit 1
            fi
            case "$platform" in
              win32-*) dest="$dir/aihu-compile.exe" ;;
              *)       dest="$dir/aihu-compile" ;;
            esac
            cp "$src" "$dest"
            # Restore +x lost in actions/download-artifact@v8 (does NOT preserve
            # POSIX mode bits). Skip win32 — NTFS has no exec bit and we run on
            # Linux. Without this the published tarball ships aihu-compile as
            # -rw-r--r-- and Bun consumers (postinstall blocked for untrusted
            # deps) cannot fix it, so resolveCompilerBinary()'s isUsableExecutable
            # X_OK check rejects it.
            case "$platform" in
              win32-*) ;;
              *) chmod 0755 "$dest" ;;
            esac
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: skip if this version is already on npm (re-run / retag).
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public $NPM_EXTRA )
          done

  # ---------------------------------------------------------------------------
  # @aihu/compiler native ADDON (napi-rs, packages/compiler/src-native) — the
  # in-process compile fast path. Mirrors the @aihu/server build-native /
  # publish-native pattern: per-platform .node cdylibs shipped as
  # @aihu/compiler-native-<platform> optionalDependency packages
  # (packages/compiler/npm-native/<platform>/), loaded by
  # packages/compiler/js/native.ts. The CLI binary lanes above are UNCHANGED —
  # the addon is an additional backend, and the spawn path remains the
  # universal fallback. Same 5 platforms as the CLI matrix; linux-arm64 uses
  # `cross` like the CLI build (napi cdylibs cross-compile cleanly under it).
  # ---------------------------------------------------------------------------
  build-compiler-napi:
    name: Build compiler addon ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            node-file: aihu-compiler-native.darwin-arm64.node
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          # x86_64 darwin: cross-target on macos-14 (macos-13 EOL'd 2025-12-04);
          # LLVM cross-compiles darwin-on-darwin natively.
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            node-file: aihu-compiler-native.darwin-x64.node
            cdylib: libaihu_compiler_native.dylib
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            node-file: aihu-compiler-native.linux-x64-gnu.node
            cdylib: libaihu_compiler_native.so
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            platform: linux-arm64-gnu
            node-file: aihu-compiler-native.linux-arm64-gnu.node
            cdylib: libaihu_compiler_native.so
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            node-file: aihu-compiler-native.win32-x64-msvc.node
            cdylib: aihu_compiler_native.dll
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # stable @ 2024-10-25
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.use_cross == true
        # Same pin as the CLI `build` job — cross v0.2.5, --locked.
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Build release cdylib (cargo)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml

      - name: Build release cdylib (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/src-native/Cargo.toml

      - name: Stage .node file (Unix)
        if: runner.os != 'Windows'
        run: |
          # src-native is EXCLUDED from the root workspace, so cargo emits to
          # packages/compiler/src-native/target/, not ./target.
          cp packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} ${{ matrix.node-file }}

      - name: Stage .node file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "packages/compiler/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" -Destination "${{ matrix.node-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: compiler-napi-${{ matrix.platform }}
          path: ${{ matrix.node-file }}
          if-no-files-found: error
          retention-days: 7

  publish-compiler-napi:
    name: Publish @aihu/compiler-native-* platform packages
    needs: build-compiler-napi
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 20
    # Tag push (stable) OR canary workflow_dispatch (see publish-native).
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup Bun (canary)
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Snapshot version (canary)
        # See publish-native's snapshot step — identical, deterministic per SHA.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun scripts/stamp-platform-snapshot.ts

      - name: Download all compiler addon artifacts
        uses: actions/download-artifact@v8
        with:
          path: compiler-napi-artifacts

      - name: Stage and publish each platform package (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        run: |
          set -euo pipefail
          NPM_EXTRA=""
          if [ -n "${CANARY:-}" ]; then NPM_EXTRA="--tag canary"; fi
          if [ -n "${CANARY_DRY_RUN:-}" ]; then NPM_EXTRA="$NPM_EXTRA --dry-run"; fi
          for dir in packages/compiler/npm-native/*/; do
            platform=$(basename "$dir")
            node_file=$(ls compiler-napi-artifacts/compiler-napi-$platform/*.node 2>/dev/null || true)
            # HARD FAIL, not silent skip: a missing binary here would publish
            # an empty platform package and brick install resolution for that
            # platform — this is the exact FEL-414 shape (napi addon stranded
            # on npm at 0.1.0 through nine CLI bumps) a silent skip caused.
            if [ -z "$node_file" ]; then
              echo "::error::no .node artifact for $platform (expected compiler-napi-artifacts/compiler-napi-$platform/*.node)"
              exit 1
            fi
            dest="$dir/$(basename "$node_file")"
            cp "$node_file" "$dest"
            # No chmod: .node files are dlopen()'d, not exec()'d (see the
            # publish-native NOTE — do not change without re-verifying dlopen).
            # Final guard: the staged file must be non-empty before publish.
            if [ ! -s "$dest" ]; then
              echo "::error::staged binary is empty: $dest (platform $platform)"
              exit 1
            fi
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: skip if this version is already on npm (re-run / retag).
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public $NPM_EXTRA )
          done

  # ---------------------------------------------------------------------------
  # Publish all tier A/B/C/D @aihu/* JS packages on `v*` tag.
  #
  # Mirrors the publish-native pattern: triggered only by an actual tag push,
  # consumes NPM_TOKEN secret, runs after compiler binaries (`build`) and the
  # @aihu/server-* native packages (`build-native` + `publish-native`) so that
  # by the time these JS packages reach npm their declared
  # `optionalDependencies` already resolve.
  #
  # Uses `bun publish --workspaces` because Bun rewrites `workspace:*` deps to
  # actual versions automatically. Changesets has versioned the packages on
  # the previous Release-PR merge; this job just publishes whatever's in
  # package.json today.
  # ---------------------------------------------------------------------------
  publish-packages:
    name: Publish @aihu/* packages to npm
    # lockfile-integrity is FIRST and is not decorative: it holds the
    # --frozen-lockfile check this job used to perform itself. Keeping it in
    # `needs:` means a genuine lock/manifest mismatch still blocks the publish
    # instead of merely reporting red beside it. See that job's comment.
    needs: [lockfile-integrity, build, build-wasm, build-native, publish-native, build-css-native, publish-css-native, publish-compiler-native, build-compiler-napi, publish-compiler-napi]
    runs-on: ubuntu-22.04
    # Longest observed run of this job is ~3 min; without a bound a hang
    # inherits GitHub's 360 min default and stalls the release for six hours.
    timeout-minutes: 30
    # Tag push (stable) OR canary workflow_dispatch. In canary mode the needed
    # publish-* jobs above all run (canary condition), so `needs` still chains.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.canary)
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm token)
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup moon toolchain
        # `bun run build` invokes `moon run :build` (root package.json) which
        # requires the moon CLI on PATH. Plan A CI installs this via
        # moonrepo/setup-toolchain; mirror it here so prepublishOnly can
        # actually compile the workspace before publish.
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace
        # NOT --frozen-lockfile, deliberately. This job `needs:` all four
        # platform-publish jobs, so by the time it runs those platform versions
        # exist on npm — versions that were UNRESOLVABLE when bun.lock was last
        # refreshed and are therefore absent from it. A frozen install resolves
        # them, wants to add them, and hard-fails. That is not hypothetical: it
        # is what half-published v0.4.62 (binaries yes, JS packages no).
        #
        # Integrity has not been dropped, it has been MOVED. The
        # `lockfile-integrity` job runs the frozen install with no `needs:`, so
        # it observes the registry before this workflow can change it, and this
        # job gates on it. Restoring --frozen-lockfile here re-breaks the
        # release on the next tag that publishes a new platform version.
        #
        # Letting the platform packages actually install is a bonus: this is the
        # first point in the pipeline where a broken platform publish surfaces
        # rather than being silently dropped as an unresolvable optional dep.
        run: bun install

      - name: Snapshot version (canary)
        # Ephemeral 0.0.0-canary-<sha> versions, identical to the ones the
        # publish-*-native jobs computed (deterministic {tag}-{commit} template
        # from the same SHA). Re-run `bun install` afterwards so bun.lock
        # matches the bumped versions before packing — publish-all.sh's
        # workspace:* rewrite reads lock-resolved versions.
        if: github.event_name == 'workflow_dispatch' && inputs.canary
        env:
          HUSKY: '0'
          # @changesets/changelog-github requires a token even for snapshot
          # changelog assembly.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bun scripts/canary-catchall-changeset.ts
          bun changeset version --snapshot canary
          bun scripts/stamp-platform-snapshot.ts
          bun install

      - name: Download compiler binaries
        # The compiler's `build` job produced the freshly-built per-platform
        # aihu-compile binaries as artifacts. Stage the host platform's binary
        # so the `bun run build` step below (which compiles .aihu sources via
        # the workspace `target/` dev fallback OR this staged bin) can exec it.
        uses: actions/download-artifact@v8
        with:
          path: native-artifacts

      - name: Stage compiler bin (linux-x64 host)
        run: |
          mkdir -p packages/compiler/bin
          if [ -f native-artifacts/aihu-compile-linux-x64/aihu-compile-linux-x64 ]; then
            cp native-artifacts/aihu-compile-linux-x64/aihu-compile-linux-x64 packages/compiler/bin/aihu-compile
            chmod 0755 packages/compiler/bin/aihu-compile
          fi
          # This staged bin is ONLY for build-time compile steps in this job.
          # It does NOT affect what gets packed: the published @aihu/compiler
          # tarball's `bin` target is the committed ESM shim
          # (bin/aihu-compile.mjs), and `files` lists only that .mjs — never the
          # native binary. The per-platform native binaries are published
          # separately by the publish-compiler-native job above and resolved at
          # runtime via the @aihu/compiler-<platform> optionalDependencies.

      - name: Build all packages
        run: bun run build

      - name: Publish via Changesets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OIDC trusted-publisher allowlist (Settings → Secrets and variables
          # → Actions → Variables). Comma-separated short names:
          # "signals,arbor,runtime,context,data". publish-all.sh adds
          # --provenance only for listed packages so unconfigured tiers don't
          # fail mid-rollout. Set NPM_PROVENANCE=1 once every package has the
          # npmjs.com trusted-publisher config done.
          NPM_PROVENANCE_PKGS: ${{ vars.NPM_PROVENANCE_PKGS }}
          NPM_PROVENANCE: ${{ vars.NPM_PROVENANCE }}
          CANARY: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary) && '1' || '' }}
          CANARY_DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.canary && inputs.dry_run) && '1' || '' }}
        # Stable (tag push): `bun run release` = build + publish-all.sh → latest.
        # Canary: same build, then publish-all.sh --tag canary (+ --dry-run by
        # default) — publish-all.sh itself refuses 0.0.0-* snapshots on `latest`.
        run: |
          if [ -n "${CANARY:-}" ]; then
            bun run build
            ARGS="--tag canary"
            if [ -n "${CANARY_DRY_RUN:-}" ]; then ARGS="--dry-run $ARGS"; fi
            bash scripts/publish-all.sh $ARGS
          else
            bun run release
          fi
