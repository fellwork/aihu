name: Release scribe-compile binaries

# Cross-compile the scribe-compile Rust binary for all supported platforms,
# then publish a GitHub Release with all four binaries attached as assets.
#
# Triggers:
#   - push of any tag matching `v*` (real release)
#   - manual workflow_dispatch with optional `tag` input (dry run; binaries
#     are uploaded as workflow artifacts but no GitHub Release is created
#     unless the input parses as an actual `v*` tag).
#
# Consumed by packages/compiler/js/postinstall.ts via the
# `releases/latest/download/<asset>` redirect.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to dry-run the build against (no release created)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: scribe-compile-darwin-arm64
            ext: ''
          - runner: macos-13
            target: x86_64-apple-darwin
            asset: scribe-compile-darwin-x64
            ext: ''
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: scribe-compile-linux-x64
            ext: ''
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: scribe-compile-windows-x64.exe
            ext: '.exe'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable @ 2024-10-25
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact
          cp packages/compiler/target/${{ matrix.target }}/release/scribe-compile artifact/${{ matrix.asset }}
          chmod 0755 artifact/${{ matrix.asset }}

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path "packages/compiler/target/${{ matrix.target }}/release/scribe-compile.exe" -Destination "artifact/${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: artifact/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    # Only create a Release when triggered by an actual tag push. The
    # workflow_dispatch dry-run path stops after `build`; binaries are
    # available as workflow artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.2.1
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # @scribe/server native renderer (napi-rs Rust addon).
  #
  # Parity-gate paths (AC-15, spec-server-native.md §4.4): the parity gate
  # triggers on PRs touching
  #   - packages/server/src/ssr.ts
  #   - packages/server/src-native/**
  # The build-native job below builds the addon for the runner's platform; the
  # parity test (packages/server/tests/native-parity.test.ts) then runs against
  # the freshly-built binary. No env-var gate is needed — on a supported
  # platform a missing binary throws via the loader (AC-9, spec §5.1), so CI
  # without the addon is automatically a hard fail. The PR-time enforcement
  # lives in the per-PR CI workflow (see .github/workflows/ci.yml or moon's
  # local CI gate); this release workflow builds and publishes the per-platform
  # .node binaries that ship as @scribe/server-<platform> packages.
  # ---------------------------------------------------------------------------
  build-native:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            node-file: server-native.darwin-arm64.node
            cdylib: libscribe_server_native.dylib
          - runner: macos-13
            target: x86_64-apple-darwin
            platform: darwin-x64
            node-file: server-native.darwin-x64.node
            cdylib: libscribe_server_native.dylib
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            node-file: server-native.linux-x64-gnu.node
            cdylib: libscribe_server_native.so
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            node-file: server-native.win32-x64-msvc.node
            cdylib: scribe_server_native.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable @ 2024-10-25
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/server/src-native/Cargo.toml

      - name: Stage .node file (Unix)
        if: runner.os != 'Windows'
        run: |
          cp packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} ${{ matrix.node-file }}

      - name: Stage .node file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" -Destination "${{ matrix.node-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.node-file }}
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish @scribe/server-* platform packages
    needs: build-native
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Stage and publish each platform package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/server/npm/*/; do
            platform=$(basename "$dir")
            node_file=$(ls native-artifacts/native-$platform/*.node 2>/dev/null || true)
            if [ -n "$node_file" ]; then
              cp "$node_file" "$dir/"
              ( cd "$dir" && npm publish --access public )
            else
              echo "no .node artifact for $platform — skipping"
            fi
          done
