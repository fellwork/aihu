name: Release aihu-compile binaries

# Cross-compile the aihu-compile Rust binary for all supported platforms,
# build the WASM bundle for browser playground use, then publish a GitHub
# Release with all binaries (+ WASM bundle + SHA256 sidecars) attached as assets.
#
# Triggers:
#   - push of any tag matching `v*` (real release)
#   - manual workflow_dispatch with optional `tag` input (dry run; binaries
#     are uploaded as workflow artifacts but no GitHub Release is created
#     unless the input parses as an actual `v*` tag).
#
# Consumed by:
#   - packages/compiler/js/postinstall.ts via the
#     `releases/latest/download/<asset>` redirect (verifies SHA256).
#   - apps/docs/ playground (arch-1 §3.5 + arch-4 §4.6) fetches the WASM
#     bundle from `releases/latest/download/aihu-compile-wasm.tar.gz`.
"on":
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional tag to dry-run the build against (no release created)'
        required: false
        default: ''

permissions:
  contents: write

# Force every `cargo` invocation to resolve toolchain to 1.88 by default.
# The dtolnay/rust-toolchain action installs the version but doesn't always
# rewrite rustup's default; without this env, plain `cargo build` falls back
# to the system default (1.87) which fails napi-build@2.3.1's rust-version
# check. See PR #68 for the original toolchain bump and run 25394476208 for
# the failure that exposed the env-vs-default-toolchain gap.
env:
  RUSTUP_TOOLCHAIN: "1.88"

jobs:
  build:
    name: Build ${{ matrix.asset }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            asset: aihu-compile-darwin-arm64
            ext: ''
            use_cross: false
          # x86_64 darwin built on macos-14 (Apple Silicon) via cross-target.
          # macos-13 reached end-of-life 2025-12-04 and was removed from GitHub's
          # hosted-runner pool — jobs requesting `runs-on: macos-13` queue forever.
          # rustup adds the x86_64-apple-darwin stdlib on demand and cargo builds
          # for the requested target; no QEMU/cross needed (LLVM cross-compiles
          # natively for darwin on darwin hosts).
          - runner: macos-14
            target: x86_64-apple-darwin
            asset: aihu-compile-darwin-x64
            ext: ''
            use_cross: false
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            asset: aihu-compile-linux-x64
            ext: ''
            use_cross: false
          - runner: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            asset: aihu-compile-linux-arm64
            ext: ''
            use_cross: true
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            asset: aihu-compile-windows-x64.exe
            ext: '.exe'
            use_cross: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable @ 2024-10-25
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Install cross (aarch64-linux only)
        if: matrix.use_cross == true
        # cross v0.2.5 (2023-02-04) — latest stable tag; uses its committed
        # Cargo.lock (--locked) so thiserror stays on v1, avoiding the v1/v2
        # conflict that caused the previous git-rev pin (4090beca) to fail.
        # Commit: 88f49ff79e777bef6d3564531636ee4d3cc2f8d2
        run: cargo install cross --git https://github.com/cross-rs/cross --tag v0.2.5 --locked

      - name: Build release binary (cargo)
        if: matrix.use_cross == false
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml

      - name: Build release binary (cross)
        if: matrix.use_cross == true
        run: cross build --release --target ${{ matrix.target }} --manifest-path packages/compiler/Cargo.toml

      - name: Stage asset (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p artifact
          cp packages/compiler/target/${{ matrix.target }}/release/aihu-compile artifact/${{ matrix.asset }}
          chmod 0755 artifact/${{ matrix.asset }}
          # SHA256 sidecar — postinstall.ts verifies digest before placing binary on disk.
          sha256sum artifact/${{ matrix.asset }} | awk '{print $1}' > artifact/${{ matrix.asset }}.sha256
          echo "Generated SHA256: $(cat artifact/${{ matrix.asset }}.sha256)"

      - name: Stage asset (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item -Path "packages/compiler/target/${{ matrix.target }}/release/aihu-compile.exe" -Destination "artifact/${{ matrix.asset }}"
          # SHA256 sidecar — postinstall.ts verifies digest before placing binary on disk.
          $hash = (Get-FileHash -Algorithm SHA256 "artifact/${{ matrix.asset }}").Hash.ToLower()
          $hash | Out-File -FilePath "artifact/${{ matrix.asset }}.sha256" -Encoding ascii -NoNewline
          Write-Host "Generated SHA256: $hash"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            artifact/${{ matrix.asset }}
            artifact/${{ matrix.asset }}.sha256
          if-no-files-found: error
          retention-days: 7

  build-wasm:
    name: Build aihu-compile-wasm bundle
    runs-on: ubuntu-22.04
    # WASM bundle for browser-side compilation in the homepage playground
    # (Directive 1 + arch-4 §4.6). Output is a tar.gz of the wasm-pack `pkg-wasm/`
    # directory so consumers receive the full glue (.wasm + .js + .d.ts + package.json).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain (wasm32)
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable @ 2024-10-25
        with:
          toolchain: "1.88"
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Build WASM bundle
        run: |
          cd packages/compiler
          wasm-pack build --target web --out-dir pkg-wasm
          ls -la pkg-wasm/

      - name: Stage WASM bundle
        run: |
          mkdir -p artifact
          tar -czf artifact/aihu-compile-wasm.tar.gz -C packages/compiler pkg-wasm
          # SHA256 sidecar
          sha256sum artifact/aihu-compile-wasm.tar.gz | awk '{print $1}' > artifact/aihu-compile-wasm.tar.gz.sha256
          # Size diagnostics — non-fatal warnings, just observability.
          raw=$(stat -c %s artifact/aihu-compile-wasm.tar.gz)
          gz_wasm=$(gzip -9 -c packages/compiler/pkg-wasm/aihu_compiler_bg.wasm | wc -c)
          echo "Tar.gz bundle size: $raw bytes"
          echo "Raw .wasm gzipped:  $gz_wasm bytes (target <500KB = 512000)"
          if [ "$gz_wasm" -gt 512000 ]; then
            echo "::warning::WASM gzipped size $gz_wasm exceeds 500KB target (arch-4 §4.6)"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aihu-compile-wasm
          path: |
            artifact/aihu-compile-wasm.tar.gz
            artifact/aihu-compile-wasm.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: [build, build-wasm]
    runs-on: ubuntu-22.04
    # Only create a Release when triggered by an actual tag push. The
    # workflow_dispatch dry-run path stops after build/build-wasm; binaries
    # are available as workflow artifacts only.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact directory
        run: |
          mkdir -p release-assets
          # Skip 0-byte files. The GitHub Release Asset API rejects empty
          # uploads with "size must be greater than or equal to 1"; a single
          # empty sidecar (typically from a partial-failed prior run that
          # downloaded an artifact for re-upload) would tank the whole
          # release-create step.
          find artifacts -type f ! -empty -exec cp {} release-assets/ \;
          ls -la release-assets/
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.2.1
        with:
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true

  # ---------------------------------------------------------------------------
  # @aihu/server native renderer (napi-rs Rust addon).
  #
  # Parity-gate paths (AC-15, spec-server-native.md §4.4): the parity gate
  # triggers on PRs touching
  #   - packages/server/src/ssr.ts
  #   - packages/server/src-native/**
  # The build-native job below builds the addon for the runner's platform; the
  # parity test (packages/server/tests/native-parity.test.ts) then runs against
  # the freshly-built binary. No env-var gate is needed — on a supported
  # platform a missing binary throws via the loader (AC-9, spec §5.1), so CI
  # without the addon is automatically a hard fail. The PR-time enforcement
  # lives in the per-PR CI workflow (see .github/workflows/ci.yml or moon's
  # local CI gate); this release workflow builds and publishes the per-platform
  # .node binaries that ship as @aihu/server-<platform> packages.
  # ---------------------------------------------------------------------------
  build-native:
    name: Build native ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: aarch64-apple-darwin
            platform: darwin-arm64
            node-file: server-native.darwin-arm64.node
            cdylib: libaihu_server_native.dylib
          # x86_64 darwin native addon: cross-target on macos-14 (see build matrix
          # above — macos-13 EOL'd 2025-12-04). napi-rs cross-targets cleanly when
          # rustup has the x86_64-apple-darwin stdlib installed.
          - runner: macos-14
            target: x86_64-apple-darwin
            platform: darwin-x64
            node-file: server-native.darwin-x64.node
            cdylib: libaihu_server_native.dylib
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x64-gnu
            node-file: server-native.linux-x64-gnu.node
            cdylib: libaihu_server_native.so
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: win32-x64-msvc
            node-file: server-native.win32-x64-msvc.node
            cdylib: aihu_server_native.dll
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1482605bfc5719782e1267fd0c0cc350fe7646b8 # stable @ 2024-10-25
        with:
          toolchain: "1.88"
          targets: ${{ matrix.target }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build release cdylib
        run: cargo build --release --target ${{ matrix.target }} --manifest-path packages/server/src-native/Cargo.toml

      - name: Stage .node file (Unix)
        if: runner.os != 'Windows'
        run: |
          cp packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }} ${{ matrix.node-file }}

      - name: Stage .node file (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Path "packages/server/src-native/target/${{ matrix.target }}/release/${{ matrix.cdylib }}" -Destination "${{ matrix.node-file }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: ${{ matrix.node-file }}
          if-no-files-found: error
          retention-days: 7

  publish-native:
    name: Publish @aihu/server-* platform packages
    needs: build-native
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download all native artifacts
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Stage and publish each platform package (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          for dir in packages/server/npm/*/; do
            platform=$(basename "$dir")
            node_file=$(ls native-artifacts/native-$platform/*.node 2>/dev/null || true)
            if [ -z "$node_file" ]; then
              echo "no .node artifact for $platform — skipping"
              continue
            fi
            cp "$node_file" "$dir/"
            pkg_name=$(node -p "require('./$dir/package.json').name")
            pkg_version=$(node -p "require('./$dir/package.json').version")
            # Idempotency: 'npm view <pkg>@<ver>' returns the version string when
            # already published, empty string otherwise. Skip publish on hit so
            # release workflow re-runs (post-fix retag) don't 403 on the fixed
            # platform-publish step and skip-block downstream workspace publish.
            existing=$(npm view "${pkg_name}@${pkg_version}" version 2>/dev/null || true)
            if [ -n "$existing" ]; then
              echo "${pkg_name}@${pkg_version} already published — skipping"
              continue
            fi
            ( cd "$dir" && npm publish --access public )
          done

  # ---------------------------------------------------------------------------
  # Publish all tier A/B/C/D @aihu/* JS packages on `v*` tag.
  #
  # Mirrors the publish-native pattern: triggered only by an actual tag push,
  # consumes NPM_TOKEN secret, runs after compiler binaries (`build`) and the
  # @aihu/server-* native packages (`build-native` + `publish-native`) so that
  # by the time these JS packages reach npm their declared
  # `optionalDependencies` already resolve.
  #
  # Uses `bun publish --workspaces` because Bun rewrites `workspace:*` deps to
  # actual versions automatically. Changesets has versioned the packages on
  # the previous Release-PR merge; this job just publishes whatever's in
  # package.json today.
  # ---------------------------------------------------------------------------
  publish-packages:
    name: Publish @aihu/* packages to npm
    needs: [build, build-wasm, build-native, publish-native]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm token)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Setup moon toolchain
        # `bun run build` invokes `moon run :build` (root package.json) which
        # requires the moon CLI on PATH. Plan A CI installs this via
        # moonrepo/setup-toolchain; mirror it here so prepublishOnly can
        # actually compile the workspace before publish.
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Install workspace
        run: bun install --frozen-lockfile

      - name: Download compiler binaries
        # Postinstall would normally fetch from GitHub releases at install
        # time on the consumer machine; in CI we have the freshly-built
        # artifacts available. Stage the host platform's binary so the
        # compiler package's prepublishOnly + bin field are coherent.
        uses: actions/download-artifact@v4
        with:
          path: native-artifacts

      - name: Stage compiler bin (linux-x64 host)
        run: |
          mkdir -p packages/compiler/bin
          if [ -f native-artifacts/aihu-compile-linux-x64/aihu-compile-linux-x64 ]; then
            cp native-artifacts/aihu-compile-linux-x64/aihu-compile-linux-x64 packages/compiler/bin/aihu-compile
            chmod 0755 packages/compiler/bin/aihu-compile
          fi
          # The published tarball does NOT include this bin file — consumer
          # postinstall fetches the right binary for their platform from the
          # GitHub Release. The bin/ entry in package.json points to the
          # postinstall-populated path. Staging here is for prepublishOnly
          # build steps that exec the binary; not bundled.

      - name: Build all packages
        run: bun run build

      - name: Publish via Changesets
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun run release
