name: Plan A — TS runtime family
# CI is intentionally manual-only during v0 development.
# - Gates (typecheck/test/build/size/bench) all still pass locally and
#   are validated by the Verifier subagent on every Builder dispatch.
# - Re-enable the auto triggers BEFORE v1 ships. Restore by uncommenting
#   the push/pull_request blocks below. The job definitions are intact.
# Tracking: state-plan-a.md "Open items".
on:
  workflow_dispatch:
  # push:
  #   branches: [main, 'plan-a-phase-*', 'plan-*', 'phase-*/**', 'bench/**', 'spec/**']
  #   paths-ignore:
  #     - '.team/**'
  #     - 'docs/**'
  #     - '.claude/**'
  #     - 'state-*.md'
  #     - 'README.md'
  #     - '**/*.md'
  # pull_request:
  #   branches: [main]
  #   types: [opened, reopened, synchronize, ready_for_review]
  #   paths-ignore:
  #     - '.team/**'
  #     - 'docs/**'
  #     - '.claude/**'
  #     - 'state-*.md'
  #     - 'README.md'
  #     - '**/*.md'

jobs:
  check:
    # Skip CI on draft PRs to keep the inner Builder loop cheap.
    # Push-to-main and ready-for-review PRs still gate.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bun run typecheck
      - run: bun run test --coverage
      - run: bun run build
      - run: bun run size

  changes:
    # Determine which subsystems changed in this push/PR. The bench job runs
    # only when signals or bench code is touched (per Phase 2.5 brief).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      bench: ${{ steps.filter.outputs.bench }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bench:
              - 'packages/signals/**'
              - 'bench/signals/**'
              - '.github/workflows/plan-a.yml'

  bench:
    # Bench-vs-SOTA regression gate (Phase 2.5, Learning #11). Runs whenever
    # signals or the bench harness changes. Compares current p50 to the
    # baseline RESULTS.md on `main`; fails if @scribe/signals regresses
    # > 10 % on any workload. Override via `[bench-bump]` in the commit
    # message — see bench/signals/HARNESS.md for the override path.
    runs-on: ubuntu-latest
    needs: [check, changes]
    if: needs.changes.outputs.bench == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build @scribe/signals
        run: bun run --filter @scribe/signals build
      - name: Capture previous RESULTS.md from main
        run: |
          mkdir -p /tmp/bench-prev
          if git show origin/main:bench/signals/RESULTS.md > /tmp/bench-prev/RESULTS.md 2>/dev/null; then
            echo "Got previous RESULTS.md from origin/main"
          else
            echo "No previous RESULTS.md on main — first run, skipping gate"
            echo "FIRST_RUN=1" >> $GITHUB_ENV
          fi
      - name: Run bench
        working-directory: bench/signals
        run: bun src/runner.ts
      - name: Detect bench-bump override
        run: |
          if git log -1 --pretty=%B | grep -q '\[bench-bump\]'; then
            echo "BENCH_BUMP=1 (commit message contains [bench-bump])"
            echo "BENCH_BUMP=1" >> $GITHUB_ENV
          fi
      - name: Regression gate
        if: env.FIRST_RUN != '1'
        working-directory: bench/signals
        run: bun src/gate.ts /tmp/bench-prev/RESULTS.md ./RESULTS.md
      - name: Upload RESULTS.md
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/signals/RESULTS.md
