name: Plan A — TS runtime family
# Auto-triggers re-enabled at v1 cutover (Plan 7.1, 2026-05-03).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.team/**'
      - 'docs/**'
      - '.claude/**'
      - 'state-*.md'
      - 'README.md'
      - '**/*.md'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]
    # No paths-ignore here: the workflow must trigger on EVERY PR so the
    # always-on `ci-ok` job reports a required status for branch protection.
    # Doc-only PRs skip the heavy `check` job via the `changes.code` filter
    # below (so they cost only `changes` + `ci-ok`, a few seconds), and `ci-ok`
    # still reports green so the PR is mergeable without an admin override.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  check:
    # Skip CI on draft PRs to keep the inner Builder loop cheap.
    # Skip the heavy build on doc-only PRs (changes.code == 'false') — the
    # always-on `ci-ok` job still reports green for branch protection.
    # Push-to-main and ready-for-review code PRs still gate.
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # css-engine e2e suites (tests/e2e.test.ts spawns aihu-css-compile;
      # tests/sfc-e2e.test.ts spawns aihu-compile --ast-json via compileToAst)
      # depend on locally-built Rust binaries that are gitignored. On a clean
      # CI checkout the postinstall download fetches the published release
      # aihu-compile, which predates the --ast-json hook and makes those e2e
      # tests fail. Build BOTH binaries from source at the workspace root and
      # stage them where the TS resolvers look, before `bun run test`.
      # Swatinem/rust-cache caches the registry + dependency build artifacts
      # but CLEANS the local workspace crates out of target/ before saving, so
      # aihu-compile + aihu-css-compile ALWAYS rebuild from source. The previous
      # hand-rolled actions/cache (keyed only on Cargo.lock) could restore a
      # stale target/ with fresh mtimes and let cargo skip rebuilding changed
      # crate source — shipping a stale aihu-css-compile into the e2e suites
      # (seen as the css-engine "static island / zero @aihu" fallback).
      - name: Cache Rust build (deps only; workspace crates always rebuild)
        uses: Swatinem/rust-cache@v2
      - name: Build Rust binaries (aihu-compile + aihu-css-compile)
        # Workspace build emits both binaries into the workspace-root
        # target/release/ — aihu-css-compile is resolved there directly by
        # packages/css-engine/src/index.ts resolveBinary().
        run: cargo build --release
      - name: Stage compiler binary
        # compileToAst (packages/compiler/js/index.ts) resolves aihu-compile
        # from packages/compiler/bin/ (the postinstall location).
        run: |
          mkdir -p packages/compiler/bin
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile
      - run: bun install --frozen-lockfile
        env:
          # Do NOT clobber the freshly-built aihu-compile with the stale
          # release download — it predates the --ast-json hook.
          AIHU_SKIP_POSTINSTALL: "1"
      - run: bun run check:deps
      # Guard: a compiler Rust change must bump the platform binary packages,
      # or the rebuilt binary is silently skipped at publish (see the script).
      - run: bun run check:compiler-binary-bump
      # Guard: every non-private package under packages/ must be in
      # publish-all.sh's hand-maintained PKGS array, or changesets bumps it
      # forever while it never reaches npm — silently, with the release job
      # green throughout. Has already bitten ui, seo, store, editor and magna.
      # Reads only manifest text, so it runs with the other cheap guards.
      - run: bun run check:publish-manifest
      # Every ```aihu fence in skills/aihu/**.md must compile, and every
      # ```aihu-error fence must fail to compile. That skill is what teaches a
      # coding agent `.aihu` syntax — if its samples rot, every agent working in
      # an aihu project is taught code the compiler rejects.
      #
      # Runs AFTER "Build Rust binaries" above, which puts aihu-compile at
      # target/release/ — exactly where check-samples.ts looks. It must not be
      # moved before that step, and it must never be pointed at the published
      # napi addon, which is a stale v1 compiler and would verify the samples
      # against the wrong grammar.
      #
      # The gate carries its own floor assertion: it fails if it finds fewer
      # samples than expected, so a renamed fence or moved file cannot make it
      # pass by checking nothing.
      - run: bun run check:skill-samples
      # NOTE: the lesson-citation gate is deliberately NOT here — see the
      # `lesson-refs` job below. This `check` job IS skipped on doc-only PRs via
      # `changes.code` (FEL-433 made that filter discriminate — it previously ran
      # on everything). A docs-facing gate therefore must NOT be a step here, or
      # it would silently skip on the doc-only PRs it most needs to run on; it
      # goes in its own always-on job instead.
      # @aihu/use registry parity — a composable's six touch points (src dir,
      # barrel, package.json exports, rolldown input, .size-limit.json row,
      # USE_COMPOSABLES tuple) must all agree, bidirectionally. Needs no build
      # output — only reads source/manifest text — so it runs early, right
      # after the other cheap Rust-source-adjacent guard above and before the
      # full build+coverage run, to fail fast and cheaply on a forgotten
      # touch point.
      - run: bun run check:use-registry-parity
        # Use the pinned local biome (node_modules/.bin via check:lint), NOT
        # `bunx biome`, which resolves its own latest copy and made CI flap when
        # biome 2.4.15 published mid-day (see PR pinning @biomejs/biome to 2.4.14).
      - run: bun run check:lint
      # README autogen sync moved OUT of this job to its own always-on
      # `readme-sync` job (C-FEL-READMESYNC-JOB). It is a DOCS-FACING gate — it
      # consumes root + every packages/**/README.md — and `check` now skips
      # doc-only PRs (FEL-433 `code` filter), so as a step here it silently
      # stopped running on the README-only PRs it exists to catch. Exactly the
      # misplacement the NOTE above (check:skill-samples) warns against.
      - run: bun run typecheck
      # Slice 0 — thesis invariants (docs/architecture/thesis.md §Invariants).
      # Each converts a property from "true today if you check" into "cannot
      # silently stop being true". All four FAIL against the tree today, at the
      # counts committed in docs/plans/slice-0-invariants/baselines.json — and
      # they gate anyway, because each exits 0 iff its finding count EQUALS its
      # baseline. A count that rises is a new violation; a count that falls is
      # also red, forcing the baseline decrement into the same PR as the fix.
      # An invariant parked outside CI protects nothing, which is the failure
      # mode check:emit-parses is in right now.
      #
      # Placed after typecheck and before test deliberately: these are cheaper
      # than the coverage run and catch a class the suites cannot, so they
      # should fail fast. Every check runs its own bidirectional self-test
      # (should-flag AND should-not-flag) before it scans the real tree, and
      # exits 1 on zero inputs rather than passing vacuously.
      #
      # check:agent-conformance is NOT here — it generates, builds and serves an
      # app, and lands as its own job once its baseline is measured (spec §Phase 2).
      - run: bun run check:derived
      - run: bun run check:attributed
      - run: bun run check:governed
      - run: bun run check:dual-audience
      # emit-parses (#453) — compile EVERY cookbook + examples/**/ .aihu fixture
      # and assert the emitted JS actually parses. The compiler test suites only
      # assert emitted output *contains* substrings; nothing proved it parsed,
      # which let five invalid-output bugs ship at once (see the script header).
      # As of #425/#449 the baseline is 0 compile / 0 parse across 58 components,
      # so it gates at --expect-parse 0 --expect-compile 0: any example or
      # component that stops compiling — or any emitter regression that produces
      # unparseable JS — fails the build, and a count that drifts either way is
      # red. Parked outside CI until now (investigation note in #445); an
      # invariant not wired in protects nothing.
      #
      # Runs here with the rest of the Slice-0-style compile invariants: it needs
      # the aihu-compile binary, staged at packages/compiler/bin above (resolved
      # newest-first by the script), and no built dist, so it can fail fast
      # before the coverage run.
      - run: bun scripts/check-emit-parses.ts --expect-parse 0 --expect-compile 0
      # cookbook corpus (P0 — corpus unification): the cookbook is the single
      # source of truth for every fluency surface. check:cookbook validates the
      # <!-- @cookbook --> frontmatter schema on all recipes and diffs the three
      # generated artifacts (mcp cookbook-index.json, llms-cookbook.txt,
      # playground presets.generated.ts) against a fresh build — a stale or
      # hand-edited artifact is a red PR, which is what prevents the pre-#497
      # fossil-index state from recurring. test:cookbook is the compile harness
      # (needs the aihu-compile binary staged above, like emit-parses).
      - run: bun run check:cookbook
      - run: bun run test:cookbook
      # governed examples (Phase 2a — governed set + coverage matrix): asserts
      # each governed example's coverage.manifest.json only claims construct rows
      # its own source actually contains (detectors in the script), and that the
      # union of manifests still covers the MUST_BE_LIVE floor. A manifest that
      # over-claims, or an edit that deletes a row's only live exerciser, is red —
      # so a coverage regression is attributable to a named example + row. Pure
      # TS, no build; runs with the other always-on invariants. The full row
      # universe incl. gaps is cookbook/COVERAGE-MATRIX.md (the Phase 2b backlog).
      - run: bun run check:coverage-manifest
      # CLI templates B1.3 — scaffold-and-compile harness exercises the
      # template against an isolated tmpdir and asserts typecheck passes
      # against the emitted scaffold. Skipped on Windows runners (matches
      # the test-level skip in scaffold-and-compile.test.ts; bun + symlink
      # behavior on Win is unreliable for this harness). legacy-snapshot
      # is platform-agnostic and always runs.
      - if: runner.os != 'Windows'
        run: bun run test packages/cli/tests/scaffold-and-compile.test.ts
      # legacy-snapshot (#434/#445): the root vitest config EXCLUDES this test
      # (so the coverage run below doesn't double-run it), which used to defeat
      # this step's explicit file filter — "No test files found, exiting 0", a
      # vacuous pass that let the #395 golden drift land unnoticed. The gates
      # config is the root config minus that exclude; passWithNoTests:false at
      # root AND in the gates config makes a zero-test selection exit 1.
      - run: bun run test packages/cli/tests/legacy-snapshot.test.ts --config vitest.gates.config.ts
      # loadAihuConfig() runs Vite's config bundler (rolldown). Under the main
      # `test --coverage` run that prevented the suite from exiting — the job
      # hit its 25m ceiling with no failing assertion. Opt-in via env, and run
      # here as its own step so the loader is still genuinely exercised.
      - run: bun run test packages/app/tests/load-config.test.ts
        env:
          AIHU_CONFIG_LOADER_E2E: '1'
      - run: bun run test --coverage
      - run: bun run build
      # b3b-sidecar-tsc (#445 audit): excluded at root and previously invoked
      # NOWHERE. It needs the built aihu-compile binary (staged above) AND
      # packages/*/dist type surfaces (its tsc pass maps @aihu/* ->
      # packages/*/dist/index.d.ts), so it runs here — after `bun run build` —
      # via the gates config. 5/5 pass with those prerequisites.
      - run: bun run test packages/compiler/tests/b3b-sidecar-tsc.test.ts --config vitest.gates.config.ts
      - run: bun run size
      # v0.2.4 — .size-limit.json row-policy lint. Flags any browser-eligible
      # package missing a row, or any server-side / build-dev-time-only package
      # with a forbidden row. See .size-limit.README.md for the policy. The
      # parent workflow runs on workflow_dispatch only; push triggers re-enable
      # at v1.0.1 per state-plan-a.md "Open follow-ups".
      - run: bun run check:size-rows
      # Runtime portability purity (Bug-4 client-leak regression). Asserts the
      # runtime-agnostic / browser / edge entries (server main, app main + app
      # client) carry NO node: builtin import. The only node:module-bearing
      # artifact allowed is @aihu/server's dist/native.js (the explicit
      # @aihu/server/native boundary). Blocks the @aihu/app@0.1.8-class leak
      # before publish. See investigation 4a796a8f-0f2b-4865-a498-73cf11b6f04c.
      - run: bun run check:runtime-purity

  # ---------------------------------------------------------------------
  # DO NOT add a `name:` to this job.
  #
  # Branch protection stores the CHECK-RUN name, which GitHub derives from a
  # job's `name:` if present and falls back to the job id otherwise. Protection
  # currently matches the literal id `ci-ok`. Adding `name: CI OK` — even as a
  # cosmetic tidy — renames the check-run, the required context `ci-ok` then
  # never reports, and protection silently detaches: PRs stay mergeable with
  # nothing enforced and no error anywhere.
  #
  # The failure produces silence rather than a signal, which is why it needs to
  # be written down next to the thing it protects rather than remembered.
  # ---------------------------------------------------------------------
  lesson-refs:
    # Every docs/lessons/*.md path cited anywhere under docs/ must exist in the
    # tree. A citation is a claim; an unreachable one fails like a dead binding —
    # quietly, and in the flattering direction.
    #
    # WHY ITS OWN JOB, and not a step in `check` — the reasoning was corrected
    # once, so the corrected version is what is written here:
    #
    # `check` is gated on `changes.code`, which excludes 'docs/**' and doc
    # markdown. Since FEL-433 that filter actually DISCRIMINATES: the `code`
    # step uses `predicate-quantifier: every` so a docs-only PR yields
    # code=false and `check` is skipped (verified with picomatch 4.0.5 under
    # dorny's MatchOptions). So a docs gate placed as a step inside `check`
    # would silently NOT run on the doc-only PRs it most needs to catch. This
    # job depends on none of that: no `if:`, no path filter, always runs. It
    # needs only git and bash — no bun install, no build, no Rust — so it costs
    # seconds.
    #
    # (Before FEL-433 the filter was INERT — dorny defaults to
    # `predicate-quantifier: some` and the leading '**' matched every file, so
    # `code` was true for everything and `check` ran even on doc-only PRs. A
    # step here worked then only by that accident; the own-job design was
    # already correct and is now load-bearing.)
    #
    # `check:ci` in package.json also lists it, for local pre-push. That is NOT
    # what makes it run: `check:ci` is invoked by no workflow in this repo. THIS
    # job is the wiring. (check:skill-samples sat unwired for a while on exactly
    # that misunderstanding; #615 fixed it.)
    #
    # Compares against HEAD, not origin/main: a main-based gate on a PR that ADDS
    # a lesson could never go green — a gate that cannot pass is as useless as
    # one that cannot fail. `LESSON_REFS_BASE=origin/main` is the separate
    # publication check, run by hand before citing a lesson outside this repo.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-lesson-refs.sh

  palette:
    # The brand palette that SHIPS must match the brand contract, or the
    # difference must be recorded (FEL-435).
    #
    # Two checks, and the second exists because of what the first could not see.
    # `check_contrast.py` audits `.tastemaker/style-lock.md`, and audits it
    # faithfully — 27 of its 30 lock-derived values were exact transcriptions.
    # What nothing audited was `packages/css-engine/src/packs.ts`, the palette a
    # user actually receives. Both artefacts were internally consistent and no
    # gate compared them, so `accent`/`border` reported 3.62 (+0.62 over the 3.0
    # ui-safe floor) while the shipped pairing is 3.12 (+0.12). The number was
    # right about the contract and silent about the product.
    #
    # WHY THIS JOB EXISTS AT ALL: `style-lock.md` mandates "re-run
    # check_contrast.py with the new token, don't eyeball it" — and NOTHING RAN
    # IT. `grep -rn check_contrast .github/ package.json scripts/` returned
    # nothing; every reference to it was prose. A mandated verification that no
    # gate performs is a gate that cannot fail, so the wiring lands in the same
    # commit as the check rather than being left for later.
    #
    # Own job, no `if:`, no path filter — historian's `lesson-refs` pattern, for
    # the same reason: `check` is gated on `changes.code`, which since FEL-433
    # discriminates (`predicate-quantifier: every`) and so SKIPS doc-only PRs. A
    # palette gate as a step in `check` would not run on a doc-only PR; as its
    # own always-on job it always does. Needs python3 and two files: seconds, no
    # install, no build, no Rust.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # The lock's own mandated tool. Exits 1 if any claimed pairing fails.
      - run: python3 .tastemaker/check_contrast.py --pairings
      # Lock vs shipped pack. Green when divergences match the recorded set; RED
      # on a new one AND on a recorded one that has quietly been fixed. Prints
      # the recorded set as DEBT every run so it cannot go quiet. Deliberately
      # not permanently red — that is the state that gets a gate disabled.
      - run: python3 .tastemaker/check_palette_parity.py --verbose

  readme-sync:
    # README autogen sync — the generated sections of root README.md and every
    # packages/**/README.md must match their canonical sources, or
    # `bun scripts/sync-readme.ts` was not re-run. Its OWN always-on job, on the
    # lesson-refs pattern, because it is a DOCS-FACING gate: it consumes READMEs,
    # which the `code` filter correctly excludes, so a README-only PR yields
    # code=false and skips `check`. It lived as a STEP inside `check` until
    # C-FEL-READMESYNC-JOB, where it silently stopped running on exactly the
    # README-only PRs it exists to catch the moment FEL-433 made the filter
    # discriminate. No `if:`, no path filter — it runs on every PR.
    #
    # Cheap like lesson-refs: `sync-readme --check` READS the committed
    # scripts/__bundle-sizes.json cache and never bundles, so it needs bun + the
    # repo but NO `bun install`, no build, no Rust. (The `rolldown` import it
    # once loaded statically at module top is now lazy — reached only in the
    # --remeasure/write path; see scripts/sync-readme.ts.) The husky pre-commit
    # hook also runs it, but that is --no-verify-bypassable and routinely
    # bypassed for docs, so it is NOT a substitute for this CI gate.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.8'
      - run: bun scripts/sync-readme.ts --check

  ci-ok:
    # Single stable REQUIRED status for branch protection. Always runs (even
    # when `check` / `examples` / `governed-examples` are skipped — e.g. a
    # doc-only PR skips `check` via the `changes.code` filter, and
    # `governed-examples` skips whenever `changes.governed` is false) so a
    # required context is always reported. Passes when EVERY one of
    # check/examples/governed-examples/lesson-refs succeeded OR was skipped;
    # fails if ANY of them failed or was cancelled. This lets doc-only PRs merge
    # without an admin override while code PRs gate on the real build AND on the
    # examples / governed-examples smoke lanes.
    #
    # ONE EXCEPTION to "skipped is allowed" — DRAFT PRs (FEL-437). Drafts skip
    # `check` / `examples` / `governed-examples` by design (see the `draft ==
    # false` guards, added to keep the inner Builder loop cheap), so without the
    # explicit test below this job would see three `skipped` results and report
    # SUCCESS having built and tested nothing. That is not hypothetical: on #622
    # and #624 the SAME commit carried two green `ci-ok` runs, one from the draft
    # pass where `check` was skipped and one from the real pass where it ran.
    #
    # It matters because `ci-ok` is the SOLE required context on `main`, and
    # "merge when ci-ok is green" is an operating rule people and agents act on.
    # A draft's green is indistinguishable from a real one in `gh pr checks` —
    # the distinguishing information lives in whether the `needs` were SKIPPED,
    # which nothing prompted anyone to read. GitHub does block merging a draft,
    # so this was never an untested-merge hole; the defect is that the status
    # LIES about coverage, and a stale draft-run green can still be the most
    # recent reported `ci-ok` for a SHA during the ready-for-review transition.
    #
    # Deliberately NOT fixed by removing "skipped is allowed": that exists so a
    # genuinely doc-only PR merges without an admin override, which is the very
    # mechanism FEL-429 exists to eliminate. Only the draft case is refused.
    #
    # `lesson-refs` carries no `if:` and no path filter, so it gates every PR
    # unconditionally, including doc-only ones. Deliberate: a doc-only PR is
    # precisely how an unreachable lesson citation gets in.
    #
    # (FEL-433: the doc-only skip described above is now REAL. It was inert until
    # FEL-433 — dorny defaults to `predicate-quantifier: some` and the leading
    # '**' matched every file, so `code` was true for every path and `check` ran
    # on doc-only PRs. The `code` filter now uses `every` and discriminates, so
    # `check` genuinely skips doc-only PRs and `lesson-refs` is what still gates
    # them.)
    #
    # examples + governed-examples were added after PR #549 merged
    # ci-ok-green while both were RED — `ci-ok` only watched `check`, so
    # branch protection (the sole required context on `main`) couldn't see
    # them. That regression broke every downstream consumer app build.
    #
    # bench / bench-arbor are deliberately NOT included: their regression
    # gate compares against the 2026-05-25 baseline RESULTS.md, whose noise
    # floor now exceeds the 10% threshold, so they fail on noise rather than
    # real regressions (see bench/signals/HARNESS.md). Wiring an unreliable
    # gate into the required check would block every PR. Revisit once a
    # fresh baseline lands.
    #
    # Each of check/examples/governed-examples is scheduled unconditionally
    # in the job graph (their own `if:` decides run vs. skip; none of them
    # can hang forever), so `needs` here can never deadlock — GitHub always
    # resolves every needed job to a terminal state (success/failure/
    # cancelled/skipped) before evaluating this job's `if: always()`, which
    # then runs regardless of what that state was.
    needs: [changes, check, examples, governed-examples, lesson-refs, palette, readme-sync]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Gate on required job results
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          EXAMPLES_RESULT: ${{ needs.examples.result }}
          GOVERNED_EXAMPLES_RESULT: ${{ needs.governed-examples.result }}
          LESSON_REFS_RESULT: ${{ needs.lesson-refs.result }}
          # `palette` was already in `needs:` — so this job WAITED on it — but
          # its result was never read here, so the gate reported green on a red
          # palette. The brand-contract check could not fail anything: exactly
          # the "a mandated verification that no gate performs is a gate that
          # cannot fail" defect the palette job's own comment was written to
          # end, reproduced one layer up. Being in `needs` is NOT being gated
          # on; only appearing in the loop below is.
          PALETTE_RESULT: ${{ needs.palette.result }}
          # readme-sync is always-on (no if:/filter), so it is never `skipped`
          # on a real event — it is success or failure. It MUST appear in the
          # loop below, not just here: being in `needs` is being WAITED on, not
          # gated on (the palette bug above, and #649, both proved that).
          README_SYNC_RESULT: ${{ needs.readme-sync.result }}
          # `true` only for a pull_request event whose PR is a draft. For push
          # and workflow_dispatch, `github.event.pull_request` is null and this
          # evaluates to `false` — so the draft rule below can never fire on a
          # branch build.
          IS_DRAFT: ${{ github.event.pull_request.draft == true }}
          # `changes.code` — 'false' means this PR is docs-only, so `check` skipped
          # BY DESIGN and ci-ok must still be green (the `on:`/`changes` header
          # promises exactly that). On a draft PR the `changes` job is skipped, so
          # this is '' — but the draft branch below never reads it. Empty on a
          # NON-draft (a broken `changes` job) must fail closed, not green.
          CODE_RESULT: ${{ needs.changes.outputs.code }}
        run: |
          echo "check:              $CHECK_RESULT"
          echo "examples:           $EXAMPLES_RESULT"
          echo "governed-examples:  $GOVERNED_EXAMPLES_RESULT"
          echo "lesson-refs:        $LESSON_REFS_RESULT"
          echo "palette:            $PALETTE_RESULT"
          echo "readme-sync:        $README_SYNC_RESULT"
          echo "draft PR:           $IS_DRAFT"
          fail=0
          for pair in "check:$CHECK_RESULT" "examples:$EXAMPLES_RESULT" "governed-examples:$GOVERNED_EXAMPLES_RESULT" "lesson-refs:$LESSON_REFS_RESULT" "palette:$PALETTE_RESULT" "readme-sync:$README_SYNC_RESULT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "::error::Required job '$name' did not pass (result=$result)."
              fail=1
            fi
          done
          # FEL-437 — a draft skipped the build, so "skipped is allowed" must not
          # silently read as a pass. Announced as a WARNING, not a failure.
          #
          # It used to fail, reasoning "a draft cannot be merged anyway, so this
          # blocks nothing." True in isolation, false in aggregate: agents are
          # instructed to push a draft PR as soon as they make their first edit
          # (work left only in a workspace is one reset from gone), so EVERY agent
          # PR was red from birth until someone promoted it. The queue filled with
          # red meaning "unfinished", real failures hid among them, and the board
          # trained everyone to ignore red — the same noise-over-signal defect
          # already fixed for the bench lanes. Red must mean "this is broken."
          #
          # Safe because two independent things stop an untested draft merging:
          # GitHub refuses to merge a draft PR at all, and draft -> ready is in
          # this workflow's `types:` list, so promotion fires a fresh run whose
          # `check` actually executes. The stale-green window the original comment
          # feared is closed by that trigger, not by this failure.
          if [ "$IS_DRAFT" = "true" ] && [ "$CHECK_RESULT" = "skipped" ]; then
            echo "::warning::Draft PR: 'check' was skipped, so nothing was built or tested. NOT evidence of a pass — mark ready for review to get a real result. Not failed, because a draft is unfinished, not broken. (FEL-437)"
          fi
          # A NON-draft whose `check` skipped is an anomaly ONLY when code changed.
          # A docs-only PR (changes.code == 'false') skips `check` BY DESIGN, and
          # the header above promises such a PR still gets ci-ok green so it is
          # mergeable without an admin override. #670 tightened this to fail EVERY
          # non-draft skip, which silently reversed that promise: every docs-only
          # PR became unmergeable the moment it was marked ready (they merged fine
          # the hour before — #657/#659/#660). So exempt the legitimate docs-only
          # skip, and fail everything else that skipped without being docs-only —
          # including a broken `changes` (code=''), which must fail closed.
          if [ "$IS_DRAFT" != "true" ] && [ "$CHECK_RESULT" = "skipped" ]; then
            if [ "$CODE_RESULT" = "false" ]; then
              echo "docs-only PR (changes.code=false): 'check' skipped by design — ci-ok green per policy."
            else
              echo "::error::'check' was skipped on a non-draft PR with code changes (changes.code='$CODE_RESULT') — ci-ok would be reporting on a build that never ran. Investigate the changes/paths filter before merging."
              fail=1
            fi
          fi
          if [ "$fail" = "1" ]; then
            exit 1
          fi
          echo "ci-ok: gate green"

  changes:
    # Determine which subsystems changed in this push/PR. The bench job runs
    # only when signals or bench code is touched (per Phase 2.5 brief).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      code: ${{ steps.code_filter.outputs.code }}
      bench: ${{ steps.filter.outputs.bench }}
      bench_lsp: ${{ steps.filter.outputs.bench_lsp }}
      governed: ${{ steps.filter.outputs.governed }}
    steps:
      - uses: actions/checkout@v4
      # `code` = any changed file that is NOT a doc/agent artifact. When false,
      # the PR is docs-only and the heavy `check` job is skipped (ci-ok still
      # reports green). This filter is NEGATION-BASED and so needs
      # `predicate-quantifier: every` (FEL-433): under dorny/paths-filter's
      # DEFAULT `some`, the leading `**` matches every file and every negation
      # below it is dead, so `code` was true even for docs-only PRs and the skip
      # never happened (verified with picomatch 4.0.5 under dorny's MatchOptions,
      # not inferred). `every` ANDs the rules, so a `docs/**` path fails
      # `!docs/**` and yields code=false. It is its OWN step because the
      # positive-include filters below (`bench`/`governed`) need `some` — a file
      # matches those if it hits ANY pattern — and a single quantifier per step
      # cannot serve both semantics.
      #
      # The `.md` exclusions are TARGETED at doc markdown, deliberately NOT a
      # blanket `!**/*.md`: `skills/aihu/**.md` are compiler INPUT that
      # check:skill-samples validates, so they must count as `code`. A blanket
      # `.md` exclusion under `every` would make a skills/aihu-only PR yield
      # code=false and SKIP the sample gate on exactly the PRs that can rot
      # samples — re-unwiring #615 through the front door (FEL-433 half-2).
      - uses: dorny/paths-filter@v3
        id: code_filter
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '**'
              - '!.team/**'
              - '!docs/**'
              - '!.claude/**'
              - '!state-*.md'
              - '!README.md'
              - '!**/README.md'
              - '!**/CHANGELOG.md'
              - '!.changeset/**'
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # Source-scoped: docs/README regeneration (e.g. sync-readme touching
            # packages/arbor/README.md from an unrelated PR) must NOT trigger the
            # perf gate on a noisy runner. Watch source + manifests + the harness.
            bench:
              - 'packages/signals/src/**'
              - 'packages/signals/package.json'
              - 'bench/signals/**'
              - 'packages/arbor/src/**'
              - 'packages/arbor/package.json'
              - 'bench/arbor/**'
              - '.github/workflows/plan-a.yml'
            bench_lsp:
              - 'packages/language-server/src/**'
              - 'packages/language-server/tests/latency.bench.ts'
              - '.github/workflows/plan-a.yml'
            # Governed examples (Phase 2a): the build/smoke matrix for the 9
            # governed examples is paid ONLY when a subsystem they exercise, an
            # example, the cookbook, or the governed tooling changes. Docs-only /
            # unrelated-package PRs skip it entirely — keeping the always-on lane
            # cheap while still gating live-conditions coverage on qualifying PRs.
            governed:
              - 'packages/compiler/**'
              - 'packages/runtime/**'
              - 'packages/signals/**'
              - 'packages/arbor/**'
              - 'packages/router/**'
              - 'packages/app/**'
              - 'packages/server/**'
              - 'packages/store/**'
              - 'packages/css-engine/**'
              - 'examples/**'
              - 'cookbook/**'
              - 'scripts/check-coverage-manifest.ts'
              - 'scripts/build-governed-examples.ts'
              - '.github/workflows/plan-a.yml'

  bench:
    # Bench-vs-SOTA regression gate (Phase 2.5, Learning #11). Runs whenever
    # signals or the bench harness changes. Compares current p50 to the
    # baseline RESULTS.md on `main`; fails if @aihu/signals regresses
    # > 10 % on any workload. Override via `[bench-bump]` in the commit
    # message — see bench/signals/HARNESS.md for the override path.
    #
    # ADVISORY, not blocking (2026-07-27). It is NOT in `ci-ok`'s needs, so it
    # never gated anything — but it still painted the PR red, and it is
    # red-by-construction: the comparison runs against a frozen baseline on
    # shared CI runners whose timing noise is unrelated to the diff under
    # review. A red X that cannot block, for a reason that is not your change,
    # is worse than no signal: it teaches everyone to ignore red, which is how
    # a REAL failure gets waved through. `continue-on-error` makes the status
    # honest — the job still runs and its numbers stay in the log, it just
    # stops claiming to be a verdict it was never wired to deliver. Promote it
    # back to blocking by adding it to `ci-ok`'s needs AND its gate loop
    # (being in `needs` alone does nothing — see the palette hole above).
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, changes]
    if: needs.changes.outputs.bench == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build @aihu/signals
        run: bun run --filter @aihu/signals build
      - name: Capture previous RESULTS.md from main
        run: |
          mkdir -p /tmp/bench-prev
          if git show origin/main:bench/signals/RESULTS.md > /tmp/bench-prev/RESULTS.md 2>/dev/null; then
            echo "Got previous RESULTS.md from origin/main"
          else
            echo "No previous RESULTS.md on main — first run, skipping gate"
            echo "FIRST_RUN=1" >> $GITHUB_ENV
          fi
      - name: Run bench
        working-directory: bench/signals
        run: bun src/runner.ts
      - name: Detect bench-bump override
        run: |
          # For PR events, github.sha is the merge-commit SHA, not the PR HEAD.
          # Check the PR HEAD SHA when available; fall back to github.sha.
          CHECK_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          if git log -1 --pretty=%B "$CHECK_SHA" 2>/dev/null | grep -q '\[bench-bump\]'; then
            echo "BENCH_BUMP=1 (commit message contains [bench-bump])"
            echo "BENCH_BUMP=1" >> $GITHUB_ENV
          fi
      - name: Regression gate
        if: env.FIRST_RUN != '1'
        working-directory: bench/signals
        run: bun src/gate.ts /tmp/bench-prev/RESULTS.md ./RESULTS.md
      - name: Upload RESULTS.md
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: bench/signals/RESULTS.md

  bench-arbor:
    # Bench-vs-SOTA regression gate for @aihu/arbor (Round N+1, Track A).
    # Runs whenever arbor or the bench harness changes.
    #
    # Two gates run here (2026-07-26 ruling, #607):
    #   1. Counted-metric gate (R8, counts.ts) — exact, machine-independent
    #      equalities (moves/swap, writes/op). No bypass. This is the
    #      trustworthy signal.
    #   2. Timing gate (gate.ts) — p50 vs the checked-in RESULTS.md baseline,
    #      GATE-tier workloads only. The committed baseline is provably
    #      invalid (two rows recorded dead bindings), so RED is the DESIGNED
    #      state for this step until R1 (same-job A/B vs merge base) replaces
    #      the mechanism. Do NOT regenerate RESULTS.md to green it.
    #
    # R0: the runner itself hard-fails if any timed op performs no DOM
    # mutation — a dead binding aborts the job rather than reporting a number.
    # Override for the timing gate only: `[bench-bump] <reason>` in the commit
    # message (the reason is mandatory — R7).
    # workflow_dispatch only — see header comment and state-plan-a.md open items.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [check, changes]
    if: needs.changes.outputs.bench == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build @aihu/signals and @aihu/arbor
        run: |
          bun run --filter @aihu/signals build
          bun run --filter @aihu/arbor build
      - name: Capture previous RESULTS.md from main
        run: |
          mkdir -p /tmp/bench-arbor-prev
          if git show origin/main:bench/arbor/RESULTS.md > /tmp/bench-arbor-prev/RESULTS.md 2>/dev/null; then
            echo "Got previous RESULTS.md from origin/main"
          else
            echo "No previous RESULTS.md on main — first run, skipping gate"
            echo "FIRST_RUN=1" >> $GITHUB_ENV
          fi
      - name: Counted-metric gate (R8 — equalities, no bypass)
        working-directory: bench/arbor
        run: bun src/counts.ts
      - name: Run arbor bench
        working-directory: bench/arbor
        env:
          # R6: signals' __DEV__ branches fold away under production, matching
          # what rolldown's `define` does in the shipped dist. The artifact
          # measured is still workspace *source* (tsconfig paths) — recorded
          # in the RESULTS.md conditions header; true dist measurement needs
          # pack-and-install isolation (truth doc §2.2).
          NODE_ENV: production
        run: bun src/runner.ts
      - name: Detect bench-bump override
        run: |
          # For PR events, github.sha is the merge-commit SHA, not the PR HEAD.
          # Check the PR HEAD SHA when available; fall back to github.sha.
          CHECK_SHA="${{ github.event.pull_request.head.sha || github.sha }}"
          BODY="$(git log -1 --pretty=%B "$CHECK_SHA" 2>/dev/null || true)"
          if printf '%s\n' "$BODY" | grep -q '\[bench-bump\]'; then
            echo "BENCH_BUMP=1 (commit message contains [bench-bump])"
            echo "BENCH_BUMP=1" >> $GITHUB_ENV
            # R7: the bypass requires a one-line justification — everything
            # after the tag on the same line. gate.ts refuses the override
            # when the reason is empty.
            REASON="$(printf '%s\n' "$BODY" | grep -m1 '\[bench-bump\]' | sed 's/.*\[bench-bump\]//' | sed 's/^[-—: ]*//')"
            echo "BENCH_BUMP_REASON=$REASON" >> $GITHUB_ENV
            echo "BENCH_BUMP_REASON=$REASON"
          fi
      - name: Regression gate (timing — RED is the designed state until R1)
        # STEP-scoped, deliberately not job-scoped (2026-07-27). This step's own
        # comment says RED is its DESIGNED state (the committed baseline is
        # provably invalid), so its failure carried no information about the
        # diff under review while still painting the job — and the PR — red.
        # The sibling "Counted-metric gate (R8)" in this same job IS the
        # trustworthy signal and MUST keep failing the job, so silencing the
        # whole job would have traded a false red for a real blind spot.
        # Scoped here, the timing numbers stay in the log and the counted gate
        # keeps its teeth. Remove this line when R1 (same-job A/B vs merge
        # base) replaces the mechanism — that is the point of the exercise.
        continue-on-error: true
        if: env.FIRST_RUN != '1'
        working-directory: bench/arbor
        run: bun src/gate.ts /tmp/bench-arbor-prev/RESULTS.md ./RESULTS.md
      - name: Upload RESULTS.md
        uses: actions/upload-artifact@v4
        with:
          name: bench-arbor-results
          path: bench/arbor/RESULTS.md

  bench-lsp:
    # LSP hover-path latency gate. Fails if overall p95 exceeds 100ms.
    # Runs when language-server source or the bench file changes.
    needs: [check, changes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: needs.changes.outputs.bench_lsp == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Run LSP hover-path latency gate
        working-directory: packages/language-server
        run: bun run bench:gate

  examples:
    # Build and smoke-test all polished examples (arch-2 M1 gate).
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Same stale-binary hardening as the check job — workspace crate
      # (aihu-compile) always rebuilds; only deps are cached. packages/compiler
      # is a root-workspace member, so it builds into the workspace-root target/
      # (NOT packages/compiler/target/) — cache the default root workspace.
      - name: Cache Rust build (deps only; workspace crates always rebuild)
        uses: Swatinem/rust-cache@v2
      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          # Root-workspace member → binary is at the workspace-root target/.
          # (The old actions/cache masked this by restoring a stale binary at
          # packages/compiler/target/; rust-cache's clean exposed the real path.)
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile
      - run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"
      - name: Build workspace packages
        run: bun run build
      - name: Build examples
        run: |
          # Build only the polished examples that are also tested.
          # blog-loader (no index.html) and blog-router (.aihu without plugin) are WIP.
          # The agent-feature showcases (agent-hub, storefront) are NOT in this
          # `vite build` set: their app scaffolding uses dev-server-only wiring
          # (agent-hub's index.html references the /@shared/ URL form that rollup
          # cannot resolve at build; storefront aliases @aihu/arbor to a path it
          # doesn't declare/install), unrelated to .aihu compile-correctness. Their
          # SFC compile is guarded instead by check:emit-parses (#453), which
          # compiles every examples/**/*.aihu (both showcases included) at 0/0, and
          # their shape/API/wire contracts by the smoke suites in the test loop
          # below (#454).
          for dir in examples/live-counter examples/temperature-converter examples/timer examples/todo-mvc examples/color-theme; do
            echo "Building ${dir}..."
            (cd "${dir}" && bun run build) || exit 1
          done
      - name: Test examples
        run: |
          # agent-hub + storefront (#454): the agent-feature showcases. They went
          # green after #425 but were outside the built+tested set, so they could
          # regress silently again (which is how they broke originally). Their smoke
          # suites (source-text + agent-registry simulation; offline, no dev server)
          # run here so a shape/API/wire regression on either fails CI. Actual SFC
          # compile regressions are caught upstream by check:emit-parses (#453).
          for dir in examples/live-counter examples/temperature-converter examples/timer examples/todo-mvc examples/color-theme examples/agent-hub examples/storefront; do
            if [ -f "${dir}/tests/smoke.test.ts" ]; then
              echo "Testing ${dir}..."
              (cd "${dir}" && bun run test) || exit 1
            fi
          done

  governed-examples:
    # Phase 2a — the governed example set under live conditions.
    #
    # Path-gated (needs.changes.outputs.governed): only pays out when a subsystem
    # the governed set exercises, an example, the cookbook, or the governed
    # tooling changes. build:governed-examples reads each example's
    # coverage.manifest.json `ci` tier and, per example, either `vite build`s it
    # (todo-mvc, layouts, css-engine-utility, ssg-site — the SPA/@aihu-app set,
    # ssg-site additionally runs the SSG prerender pass) or runs its smoke suite
    # (the server/SSR examples, whose SFC compile is already gated by
    # check:emit-parses in `check`). The tier lives with the manifest, so this
    # lane can never drift from the governed set.
    #
    # Cost: ~4 vite builds (each ~0.1–0.4s of transform, ~20–40s incl. cold
    # workspace build amortised) + a handful of smoke suites → roughly +3–5 min
    # wall on a qualifying PR, dominated by the shared `cargo build --release` +
    # `bun run build` prerequisites (same as the `examples` job). Docs-only and
    # unrelated-package PRs skip it.
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && needs.changes.outputs.governed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [check, changes]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Cache Rust build (deps only; workspace crates always rebuild)
        uses: Swatinem/rust-cache@v2
      - name: Build compiler binary
        run: cargo build --release --manifest-path packages/compiler/Cargo.toml
      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile
      - run: bun install --frozen-lockfile
        env:
          SCRIBE_SKIP_POSTINSTALL: "1"
      # Manifest integrity (also runs in `check` — cheap, and keeps this lane
      # self-contained if `check` is ever re-scoped).
      - run: bun run check:coverage-manifest
      - name: Build workspace packages
        run: bun run build
      - name: Build + smoke the governed set (data-driven by manifest ci tiers)
        run: bun run build:governed-examples
        env:
          SCRIBE_SKIP_POSTINSTALL: "1"
