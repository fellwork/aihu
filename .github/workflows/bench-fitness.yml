# Measures which @aihu/signals bench workloads are FIT TO GATE (C-FEL-409).
#
# ⚠ D1 RESOLVED 2026-08-08 — DO NOT COMMIT THIS WORKFLOW'S ARTIFACT.
# Several lines below still say "commit the artifact it uploads". That
# instruction is SUSPENDED, not merely stale: installing a fitness.json makes
# `bench` a differently-red gate rather than a green one, because this
# workflow (via repeat.ts) measures WITHIN-PROCESS spread while gate.ts would
# use it to license ACROSS-CI-RUN comparisons. Measured 2026-08-08, 2 of 6
# workloads drift past the gate's own 10 % threshold back-to-back with zero
# code changes. This workflow remains valuable as a MEASURING instrument —
# dispatch it freely to quantify runner noise, and read the artifact from the
# run summary. What is forbidden is checking the artifact into the repo.
# The suspension lifts only when R1 replaces the mechanism
# (`C-FEL-BENCH-R1-AB-HARNESS`); at that point this workflow is deleted
# rather than adopted. Single source of truth for the decision:
# bench/signals/HARNESS.md § "D1 — RESOLVED 2026-08-08".
#
# Run-to-run p50 spread is a property of the (workload × machine) pair, not of
# the workload. Measured on a loaded dev box every workload spreads 15-229 %;
# the same workloads on a CI runner do not. So the artifact the gate reads MUST
# be produced HERE, on the same runner class that runs `bench`, or it answers a
# question about a different instrument.
#
# Mostly `workflow_dispatch`: this is not a per-PR check, because it measures
# the RUNNER and nothing in a PR diff changes the runner. Re-run it when the
# runner image changes, when a workload is added, or when a gate verdict is
# disputed — and commit the artifact it uploads.
#
# The one automatic trigger is narrow ON PURPOSE: a PR that edits the
# MEASURING INSTRUMENT (repeat.ts) or this workflow re-measures, because a
# fitness artifact produced by a different instrument is not comparable to the
# one in the repo. Editing a workload, or packages/signals, does NOT trigger it
# — those change what is measured, not how noisy the machine is.
#
# NOTE for anyone adding the first fitness artifact on a fresh branch:
# `workflow_dispatch` is only dispatchable once this file is on the DEFAULT
# branch. That is why the paths trigger below exists at all — without it the
# very first measurement is unreachable from the PR that introduces it.
#
# It does NOT write fitness.json into the repo itself. A job that both measures
# fitness and installs its own measurement could quietly widen what is exempt
# from gating; the commit stays a human act with a diff to read.
name: Bench fitness — which workloads can gate

on:
  pull_request:
    paths:
      - 'bench/signals/src/repeat.ts'
      - '.github/workflows/bench-fitness.yml'
  workflow_dispatch:
    inputs:
      n:
        description: 'Runs per workload (>=5; fitness is a stability claim, so n=2 is not enough)'
        required: false
        default: '7'
      label:
        description: 'Label recorded in the artifact'
        required: false
        default: 'ci-fitness'

# Least-privilege floor (CodeQL: Workflow does not contain permissions). No
# job here pushes commits, comments, or writes releases/packages — read-only
# GITHUB_TOKEN covers checkout + the actions used.
permissions:
  contents: read
jobs:
  fitness:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - run: bun install --frozen-lockfile
      - name: Build @aihu/signals
        run: bun run --filter @aihu/signals build
      - name: Measure run-to-run spread
        working-directory: bench/signals
        env:
          BENCH_FITNESS_OUT: fitness.json
          # Recorded as provenance, not used in any comparison: a spread
          # measured on a 4-core runner does not transfer to a 2-core one.
          BENCH_FITNESS_CPUS: '${{ runner.os }}-${{ runner.arch }}'
        run: bun src/repeat.ts "${{ inputs.n || '7' }}" "${{ inputs.label || 'ci-fitness' }}"
      - name: Show artifact
        working-directory: bench/signals
        run: cat fitness.json
      - name: Upload fitness.json
        uses: actions/upload-artifact@v7
        with:
          name: bench-signals-fitness
          path: bench/signals/fitness.json
