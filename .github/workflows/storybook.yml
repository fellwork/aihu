name: Storybook — a11y + interaction + required-story gate
# Plan 6 (master spec §10.2–10.3, §12.3): builds apps/storybook, enforces the
# required-story-set gate, then runs the test-runner (play functions + axe)
# against the static build. Axe failures block merge.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/primitives/**'
      - 'packages/ui/**'
      - 'packages/css-engine/**'
      - 'packages/compiler/**'
      - 'apps/storybook/**'
      - 'scripts/check-required-stories.ts'
      - '.github/workflows/storybook.yml'
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  changes:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      storybook: ${{ steps.filter.outputs.storybook }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            storybook:
              - 'packages/primitives/**'
              - 'packages/ui/**'
              - 'packages/css-engine/**'
              - 'packages/compiler/**'
              - 'apps/storybook/**'
              - 'scripts/check-required-stories.ts'
              - '.github/workflows/storybook.yml'

  storybook:
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
      && (github.event_name != 'pull_request' || needs.changes.outputs.storybook == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      # Same stale-binary hardening as plan-a.yml: compiling .aihu stories
      # needs BOTH freshly-built Rust binaries (aihu-compile + aihu-css-compile).
      - name: Cache Rust build (deps only; workspace crates always rebuild)
        uses: Swatinem/rust-cache@v2
      - name: Build Rust binaries (aihu-compile + aihu-css-compile)
        run: cargo build --release
      - name: Stage compiler binary
        run: |
          mkdir -p packages/compiler/bin
          cp target/release/aihu-compile packages/compiler/bin/aihu-compile
          chmod 0755 packages/compiler/bin/aihu-compile
      - run: bun install --frozen-lockfile
        env:
          AIHU_SKIP_POSTINSTALL: "1"
      - name: Build workspace packages
        run: bun run build
      - name: Build Storybook
        run: bun run --cwd apps/storybook build-storybook
      - name: Required-story-set gate (spec §10.2)
        run: bun scripts/check-required-stories.ts
      - name: Install Playwright chromium (version matched to the lockfile)
        # Bare `bunx playwright` fetches the LATEST playwright (it is only a
        # transitive dep, so no .bin link exists), whose browser revision
        # differs from what the test-runner's pinned playwright-core expects
        # ("Executable doesn't exist at …"). Read the lockfile-resolved version
        # out of bun's store and install exactly that.
        run: |
          PW_VERSION=$(ls node_modules/.bun | grep -oE '^playwright@[0-9][0-9.]*' | head -1 | cut -d'@' -f2)
          echo "playwright (lockfile) = ${PW_VERSION}"
          test -n "$PW_VERSION"
          bunx "playwright@${PW_VERSION}" install --with-deps chromium
      - name: Test-runner — play functions + axe (spec §10.2–10.3)
        run: |
          bunx http-server apps/storybook/storybook-static -p 6006 --silent &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://127.0.0.1:6006 && break
            sleep 1
          done
          bun run --cwd apps/storybook test-storybook

  storybook-ok:
    # Single stable status for branch protection (mirrors plan-a's ci-ok):
    # green when the storybook job passed OR was path-skipped.
    needs: [storybook]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Gate on storybook result
        run: |
          result="${{ needs.storybook.result }}"
          echo "storybook result: $result"
          if [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
            echo "::error::Required job 'storybook' did not pass (result=$result)."
            exit 1
          fi
          echo "storybook-ok: storybook=$result — gate green"
