# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
id: bench-arbor
language: typescript
layer: application

# bench-arbor imports @aihu/arbor (transitively @aihu/signals) plus a set of
# DOM-binding competitor libs for the JSDOM-driven harness. Declaring the
# workspace deps so Moon resolves them before typecheck runs.
dependsOn:
  - 'signals'
  - 'arbor'

# Inherits typecheck from .moon/tasks/tasks.yml. The bench is an executable,
# not a library — override inherited build to a no-op (no rolldown config) and
# add a `run` task that is what humans and CI invoke.
tasks:
  build:
    command: noop
    outputs: []
    options:
      runFromWorkspaceRoot: false
      mergeOutputs: replace

  run:
    command: 'bun src/runner.ts'
    inputs:
      - 'src/**/*'
      - 'package.json'
    options:
      cache: false

  # Spawn 3 fills in the implementation; placeholder retained so Moon graph
  # is stable across the 3-spawn sequence.
  memory:
    command: 'bun --expose-gc src/memory.ts'
    inputs:
      - 'src/**/*'
      - 'package.json'
    options:
      cache: false

  size:
    command: 'bun src/size.ts'
    inputs:
      - 'src/size.ts'
      - 'package.json'
    options:
      cache: false
