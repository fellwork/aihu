# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
id: bench-signals
language: typescript
layer: application

# Inherits typecheck from .moon/tasks/tasks.yml. The bench is an executable,
# not a library — override inherited build to a no-op (no rolldown config) and
# add a `run` task that is what humans and CI invoke.
tasks:
  build:
    command: noop
    outputs: []
    options:
      runFromWorkspaceRoot: false
      mergeOutputs: replace

  # bench/signals imports `@scribe/signals` via the workspace package, which
  # resolves through `package.json` exports to `./dist/index.d.ts`. Typecheck
  # therefore requires the signals dist to exist; without this dep the inherited
  # `bunx tsc --noEmit` fails on a clean checkout (TS2307: Cannot find module).
  typecheck:
    deps:
      - 'signals:build'

  run:
    command: 'bun src/runner.ts'
    inputs:
      - 'src/**/*'
      - 'package.json'
    options:
      cache: false

  size:
    command: 'bun src/size.ts'
    inputs:
      - 'src/size.ts'
      - 'package.json'
    options:
      cache: false
