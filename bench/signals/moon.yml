# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
id: bench-signals
language: typescript
layer: application

# bench-signals imports @aihu/signals (and other reactivity libs) for the
# competitor harness. Declaring the workspace dep here so Moon's `^:build`
# resolves — without this, `bench-signals:typecheck` may run in parallel
# with `signals:build` and fail on a clean checkout (TS2307).
dependsOn:
  - 'signals'

# Inherits typecheck from .moon/tasks/tasks.yml. The bench is an executable,
# not a library — override inherited build to a no-op (no rolldown config) and
# add a `run` task that is what humans and CI invoke.
tasks:
  build:
    command: noop
    outputs: []
    options:
      runFromWorkspaceRoot: false
      mergeOutputs: replace

  run:
    command: 'bun src/runner.ts'
    inputs:
      - 'src/**/*'
      - 'package.json'
    options:
      cache: false

  # Round N+1 memory pass. Requires `--expose-gc` (Bun supports the same
  # flag as Node). Writes RESULTS.memory.json, which `run` then folds
  # into the markdown. Run in CI before `run` so the markdown table
  # contains the memory cells.
  memory:
    command: 'bun --expose-gc src/memory.ts'
    inputs:
      - 'src/memory.ts'
      - 'src/competitors/**/*'
      - 'src/workloads/**/*'
      - 'src/types.ts'
      - 'package.json'
    options:
      cache: false

  size:
    command: 'bun src/size.ts'
    inputs:
      - 'src/size.ts'
      - 'package.json'
    options:
      cache: false
