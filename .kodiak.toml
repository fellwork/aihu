# Kodiak (https://kodiakhq.com) — PR automerge bot.
#
# Kodiak watches PRs and merges them once branch protection is satisfied, so a
# PR that goes green at 2am does not sit until someone notices. It does NOT
# bypass any gate: it merges only what GitHub would already let you merge by
# hand, which for this repo means the `ci-ok` required status (see
# scripts/setup-branch-protection.sh — ci-ok is deliberately the SOLE required
# context, because `check`/`examples` legitimately SKIP on doc-only PRs).
#
# Opt-in by design: nothing merges automatically unless the `automerge` label
# is on the PR (require_automerge_label below). Adding the label is the act of
# saying "land this when it's green".
#
# AGENT PROTOCOL — this is the intended path for agentic sessions, not a
# workaround. An agent that has finished a PR and wants it landed applies the
# `automerge` label and stops. Kodiak takes it from there: it waits for `ci-ok`,
# handles the merge, and deletes the branch. The agent never has to sit on a
# CI run, poll for green, or hold merge rights of its own.
#
#   working  → no label (default state; nothing can merge)
#   finished → add `automerge`  ⇒ lands as soon as ci-ok is green
#   changed my mind mid-flight → add `agent-active` (a blocking label, and
#                                blocking beats automerge) or convert to draft
#
# The safety property that makes this sound: the default is "never merge", so
# an interrupted, crashed, or forgetful agent fails CLOSED. Landing work always
# takes a deliberate act; abandoning it never lands anything.

version = 1

[merge]
# Opt-in, not opt-out. Without the label Kodiak leaves the PR completely alone.
automerge_label = "automerge"
require_automerge_label = true

# Squash to match this repo's dominant history shape — main is overwhelmingly
# `type(scope): description (#NNN)` single commits (see #725/#726/#717/#720…).
# A branch whose individual commits are worth preserving can still be merged by
# hand with a merge commit; this only governs what Kodiak does unattended.
method = "squash"

# The repo already sets this at the GitHub level; stated here too so the
# behavior is visible in-tree rather than only in repo settings.
delete_branch_on_merge = true

# `blocked` already exists as a repo label ("Blocked by another issue"), so it
# doubles as a hard stop for Kodiak. The extra spellings are conventional
# escape hatches that cost nothing to honor.
#
# `agent-active` is the important one: this repo is worked by long-running
# agentic sessions that push follow-up commits to a branch minutes or hours
# apart. A PR can be genuinely green between two such pushes, and merging in
# that window would land half-finished work that looked complete. Two layers
# stop that:
#
#   1. require_automerge_label above — the DEFAULT is "never merge". An agent
#      that simply never applies `automerge` is already safe, which is why that
#      is the primary control rather than a convention someone must remember.
#   2. `agent-active` — a positive assertion of "a session is still working
#      this branch", for the case where `automerge` was applied EARLIER and the
#      work then continued. Blocking labels beat the automerge label, so adding
#      it mid-flight revokes automerge without having to remove it.
#
# Kodiak also does not merge draft PRs, so `gh pr ready`/draft toggling is a
# third, independent brake that needs no configuration at all.
blocking_labels = ["blocked", "agent-active", "do not merge", "DO NOT MERGE"]

# Default `^WIP:.*` would not catch this repo's conventional-commit titles
# (`fix(ci): …`), so match a WIP marker anywhere in the title instead.
blocking_title_regex = "(?i)\\b(wip|do not merge)\\b"

# Comment on the PR when it goes conflicted, instead of failing silently.
notify_on_conflict = true

[merge.message]
# Squash commits should read like the PR, not like GitHub's default
# "Merge pull request #N from user/branch" — and the resulting subject line is
# what commitlint's conventional-commit rules see on main.
title = "pull_request_title"
body = "pull_request_body"
include_pr_number = true
body_type = "markdown"
# Drop PR-template HTML comments so they don't land in the commit body.
strip_html_comments = true

[update]
# Branch protection has `strict: false` (branches need NOT be up to date to
# merge), so rebasing every open PR on each push to main would be pure CI churn
# for no gate benefit. Kodiak still updates a branch when it actually needs it
# before merging (optimistic_updates defaults on).
always = false
require_automerge_label = true

# [approve] intentionally omitted — no auto-approval. Kodiak lands what humans
# and CI have already approved; it does not manufacture the approval itself.
