# yaml-language-server: $schema=https://moonrepo.dev/schemas/tasks.json
# Shared task definitions inherited by every project under packages/*.
# Per-package moon.yml files can override or extend these.

fileGroups:
  sources:
    - "src/**/*"
  tests:
    - "tests/**/*"
  configs:
    - "tsconfig.json"
    - "rolldown.config.ts"

tasks:
  # IMPORTANT: Use "bun run build" (not "bunx rolldown -c" directly) so that
  # per-package scripts.build runs — this includes the identifier-mangle step
  # for browser-eligible packages (@aihu/signals, @aihu/arbor). Bypassing
  # the package script skips mangle and silently violates size budgets.
  build:
    command: "bun run build"
    inputs:
      - "@group(sources)"
      - "@group(configs)"
      - "package.json"
    outputs:
      - "dist"
    deps:
      - "^:build"

  typecheck:
    command: "bunx tsc --noEmit"
    inputs:
      - "@group(sources)"
      - "@group(tests)"
      - "@group(configs)"
    # Workspace packages import each other through `package.json` exports,
    # which resolve to `./dist/index.d.ts`. Typecheck therefore needs the
    # dists of upstream workspace deps to exist; without `^:build` Moon may
    # parallelize typecheck against the upstream's still-running build and
    # fail with TS2307 (Cannot find module). On a clean checkout (CI) this
    # is the difference between a green and a red gate.
    deps:
      - "^:build"
