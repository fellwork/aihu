# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Per-package tasks — the root moon.yml depends on `packages/shared:{build,test,typecheck}`.
# `shared` is consumed as source via `workspace:*`, so `build` is a noop that
# exists only to satisfy the root aggregate task's dependency graph.
layer: 'library'
language: 'typescript'

tasks:
  build:
    command: 'noop'
  test:
    command: 'vitest run'
  typecheck:
    command: 'tsc --noEmit'
