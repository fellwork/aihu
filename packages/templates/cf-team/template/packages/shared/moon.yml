# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Per-package tasks — the root moon.yml depends on `packages/shared:{build,test,typecheck}`.
# `shared` is consumed as source via `workspace:*`, so `build` is a noop that
# exists only to satisfy the root aggregate task's dependency graph.
layer: 'library'
language: 'typescript'

tasks:
  build:
    command: 'noop'
  test:
    command: 'bun run vitest run'
  # No `--noEmit`: this package's tsconfig sets `noEmit: false` +
  # `emitDeclarationOnly: true` so `dist/index.d.ts` gets written — apps/web
  # consumes this package via a project reference, which resolves against
  # that emitted declaration file, not the source. `--noEmit` on the command
  # line overrides the tsconfig option and silently skips writing it.
  typecheck:
    command: 'bun run tsc'
