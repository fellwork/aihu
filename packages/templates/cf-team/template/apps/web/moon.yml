# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
#
# Per-app tasks — the root moon.yml depends on `apps/web:{build,dev,test,typecheck}`.
# Commands mirror this package's package.json scripts (bun runs the local binaries).
layer: 'application'
language: 'typescript'

tasks:
  dev:
    command: 'bun run vite dev'
    preset: 'server'
  build:
    command: 'bun run vite build'
  test:
    command: 'bun run vitest run'
  # `deps` matters here, not just documentation: this project's tsconfig
  # references `../../packages/shared`, resolved against its EMITTED
  # `dist/index.d.ts` — without an explicit ordering dependency moon runs
  # sibling `typecheck` tasks concurrently, and this one can start reading
  # that file before `shared:typecheck` has finished writing it (TS6305).
  typecheck:
    command: 'bun run tsc --noEmit'
    deps:
      - 'shared:typecheck'
