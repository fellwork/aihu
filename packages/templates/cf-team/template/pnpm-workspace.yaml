# pnpm does not read the `workspaces` array in package.json — it wants this
# file, and without it treats the repo as a single package. That is why
# `pnpm install` failed at the scaffold step on run 30322552896:
#
#   [WARN] The "workspaces" field in package.json is not supported by pnpm.
#          Create a "pnpm-workspace.yaml" file instead.
#
# With no workspace to link against, the sibling dependency `@app/shared` had
# nowhere to resolve from and install exited 1 before writing a lockfile.
#
# Shipped unconditionally rather than only for `--pm pnpm`: bun, npm and yarn
# ignore this file entirely, so a single always-present copy costs nothing and
# removes a whole class of "works on my package manager" drift. Keep the globs
# in step with the `workspaces` array in package.json.tmpl.
packages:
  - 'apps/*'
  - 'packages/*'

# pnpm blocks every lifecycle script by default and — unlike bun, which blocks
# them silently — exits NON-ZERO doing it, so without this the very first
# `pnpm install` dies with ERR_PNPM_IGNORED_BUILDS before any file is
# typechecked. This is the pnpm counterpart of package.json's
# `trustedDependencies`, and it lives HERE because pnpm no longer reads settings
# from package.json at all — it says so on every install.
# Both entries postinstall an arch-specific native binary; a blocked script
# leaves the wrong one in place to resurface later as ENOEXEC.
#
# pnpm v11 renamed this: it was `onlyBuiltDependencies` (a list) through v10 and
# is now `allowBuilds` (a map). The old key is ignored SILENTLY — no warning —
# which is what made the previous spelling look correct while doing nothing.
# Anything not listed here is denied by default.
allowBuilds:
  '@aihu/compiler': true
  esbuild: true
