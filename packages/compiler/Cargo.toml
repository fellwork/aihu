[package]
name    = "aihu-compiler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lenient JSON5-style object-literal parser for the `@meta { … }` block
# (unquoted keys, single/double quotes, trailing commas). Speaks Serde, so it
# deserializes straight into `SfcMeta` via `#[serde(default)]` fields.
json5 = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen       = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
insta = "1"

[[bin]]
name = "aihu-compile"
path = "src/bin/main.rs"
