[package]
name    = "aihu-compiler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lenient JSON5-style object-literal parser for the `@meta { … }` block
# (unquoted keys, single/double quotes, trailing commas). Speaks Serde, so it
# deserializes straight into `SfcMeta` via `#[serde(default)]` fields.
json5 = "0.4"
# W2 (advanced-js-template-expressions, Option C hybrid): real-JS validation of
# captured template expressions via `oxc_parser::parse_expression`, behind
# `--expr-parser <legacy|ast>`. Pinned EXACT (`=`): oxc's AST churns between
# minors — upgrade deliberately, and only all five in lockstep. All oxc types
# are contained in src/expr/ (plan §Risks 1). oxc 0.139 is the MSRV driver for
# the rust-toolchain.toml 1.95.0 pin (oxc 0.139 needs rustc >= 1.94).
oxc_allocator = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_span = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_diagnostics = "=0.139.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen       = "0.2"
serde-wasm-bindgen = "0.6"

[dev-dependencies]
insta = "1"

[[bin]]
name = "aihu-compile"
path = "src/bin/main.rs"
