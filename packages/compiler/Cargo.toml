[package]
name    = "aihu-compiler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Lenient JSON5-style object-literal parser for the `@meta { … }` block
# (unquoted keys, single/double quotes, trailing commas). Speaks Serde, so it
# deserializes straight into `SfcMeta` via `#[serde(default)]` fields.
json5 = "0.4"
# W2 (advanced-js-template-expressions, Option C hybrid): real-JS validation of
# captured template expressions via `oxc_parser::parse_expression`, behind
# `--expr-parser <legacy|ast>`. W3 adds the AST-driven, scope-aware signal-read
# rewrite on the same parse (oxc_ast_visit for the visitor; oxc_syntax only for
# the ScopeFlags/ScopeId types the visitor's scope hooks name). Pinned EXACT
# (`=`): oxc's AST churns between minors — upgrade deliberately, and only all
# seven in lockstep. All oxc types are contained in src/expr/ (plan §Risks 1).
# oxc 0.139 is the MSRV driver for the rust-toolchain.toml 1.95.0 pin
# (oxc 0.139 needs rustc >= 1.94).
oxc_allocator = "=0.139.0"
oxc_parser = "=0.139.0"
oxc_span = "=0.139.0"
oxc_ast = "=0.139.0"
oxc_ast_visit = { version = "=0.139.0", default-features = false }
oxc_syntax = "=0.139.0"
oxc_diagnostics = "=0.139.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen       = "0.2"
serde-wasm-bindgen = "0.6"

# W3 wasm-size housekeeping: rustc >= 1.94 (the W2 MSRV bump) emits
# bulk-memory / sign-ext / nontrapping-fptoint ops by default, which
# wasm-pack's bundled binaryen (version 117) rejects unless the features are
# enabled explicitly — wasm-pack then SKIPS wasm-opt with a non-fatal warning,
# shipping an unoptimized (~10% larger) artifact. Passing the enable flags
# turns `wasm-opt -O` back on for both local and CI release builds.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-sign-ext", "--enable-nontrapping-float-to-int"]

[dev-dependencies]
insta = "1"

[[bin]]
name = "aihu-compile"
path = "src/bin/main.rs"
