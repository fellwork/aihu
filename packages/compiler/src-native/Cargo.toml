# @aihu/compiler native addon (napi-rs) — the in-process compile fast path.
#
# EXCLUDED from the root Cargo workspace (see /Cargo.toml [workspace.exclude]),
# mirroring packages/server/src-native: the root workspace's release profile is
# size-tuned for the wasm budget (opt-level = "z", panic = "abort"); this crate
# wants throughput (opt-level = 3) and must not drag napi deps into the
# workspace graph. Built standalone, per-platform, in release.yml
# (build-compiler-napi lane) with its own target dir.
[package]
name    = "aihu-compiler-native"
version = "0.1.0"
edition = "2021"

# Own-workspace-root pin. Unlike server/src-native, this crate sits INSIDE a
# workspace member's directory (packages/compiler), so cargo's upward walk
# attributes it to the root workspace even with the root-level exclude; the
# empty [workspace] table stops the walk and makes this crate its own root.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
napi        = { version = "2", default-features = false, features = ["napi4"] }
napi-derive = { version = "2" }
serde_json  = "1"
aihu-compiler = { path = ".." }

[build-dependencies]
napi-build = { version = "2" }

[profile.release]
lto           = "thin"
codegen-units = 1
strip         = "symbols"
opt-level     = 3
