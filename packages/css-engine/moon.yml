# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

# NOTE: The Rust crate (aihu-css-core) is NOT built automatically by any Moon task.
# Run `cargo build --release -p aihu-css-core` manually before running integration
# tests or using the engine from the CLI. Mirrors the @aihu/compiler convention.

tasks:
  build:
    command: "rolldown -c"
    inputs:
      - "src/**/*.ts"
      - "rolldown.config.ts"
    outputs:
      - "dist"
    options:
      mergeArgs: "replace"

  # typecheck is inherited from .moon/tasks/tasks.yml ("bunx tsc --noEmit" with
  # deps: ["^:build"]). Do NOT override the command here: without
  # options.mergeArgs: replace, Moon merges the inherited args into
  # `tsc --noEmit --noEmit tsc` and the stray `tsc` is read as a file (TS6231).
  # Inheriting also keeps the `^:build` dep css-engine needs once it depends on
  # @aihu/compiler (Plan 2), so typecheck never races the upstream build.

  test:
    command: "vitest run"
    inputs:
      - "src/**/*.ts"
      - "tests/**/*"
    deps:
      - "~:build"
