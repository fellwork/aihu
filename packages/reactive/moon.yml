# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

# @aihu/reactive imports @aihu/signals only (design doc
# docs/plans/2026-07-24-deep-reactivity.md §3: signals is the sole hard dep).
# Declare the project dep so Moon's `^:build` builds signals' dist + .d.ts
# BEFORE reactive's typecheck.
dependsOn:
  - 'signals'

tasks:
  build:
    command: "rolldown -c"
    inputs:
      - "src/**/*.ts"
      - "rolldown.config.ts"
    outputs:
      - "dist"
    options:
      mergeArgs: "replace"

  # typecheck is inherited from .moon/tasks/tasks.yml ("bunx tsc --noEmit"
  # with deps: ["^:build"]). Do NOT override the command here (see the
  # primitives moon.yml note on Moon's arg-merge TS6231 footgun).

  test:
    command: "vitest run"
    inputs:
      - "src/**/*.ts"
      - "tests/**/*"
    deps:
      - "~:build"
