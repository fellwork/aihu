# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: unknown
layer: configuration

# This package contains only JSON/grammar config files — no TypeScript source.
# Override the global typecheck task with a no-op to prevent tsc from walking
# up to the root tsconfig.json and checking all workspace packages.
tasks:
  typecheck:
    command: noop
    outputs: []
    options:
      runFromWorkspaceRoot: false
      mergeOutputs: replace
  build:
    command: noop
    outputs: []
    options:
      runFromWorkspaceRoot: false
      mergeOutputs: replace
