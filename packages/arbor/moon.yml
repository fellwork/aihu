# yaml-language-server: $schema=https://moonrepo.dev/schemas/project.json
language: typescript
layer: library

# arbor consumes @aihu/signals as a workspace dep. Declaring it here so
# Moon's `^:build` resolves correctly — without this, `arbor:typecheck`
# may run in parallel with `signals:build` and fail on a clean checkout
# (TS2307 because dist/index.d.ts isn't there yet).
dependsOn:
  - 'signals'
