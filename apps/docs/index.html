<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Preload the two self-hosted variable fonts. Without this, the browser
         only discovers them once it has fetched AND parsed the entry CSS and
         hit an actual paint that needs them — @font-face has no metric
         overrides (size-adjust/ascent-override/etc.), so with font-display:
         swap the gap between first-paint-in-fallback and the real font
         arriving is a real, measured layout shift (confirmed: CLS 0.217,
         deterministic across CI runs, present before AND after unrelated
         fixes — i.e. not JS timing, not CPU jitter). Preloading starts the
         fetch in parallel with CSS instead of after it. -->
    <link
      rel="preload"
      href="/fonts/Geist-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/GeistMono-Variable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>aihu — docs</title>
    <!-- Set the theme before first paint to avoid a flash. Honors a saved
         choice, else the OS preference. The theme-toggle island keeps it in
         sync at runtime. -->
    <script>
      (() => {
        try {
          const saved = localStorage.getItem('dn-theme')
          const dark =
            saved === 'dark' ||
            (saved === null &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch {}
      })()
    </script>
  </head>
  <body>
    <div id="outlet"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
