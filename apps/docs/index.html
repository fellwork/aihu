<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>aihu — The reactive Web Components framework for modern TypeScript</title>
  <meta name="description" content="A zero-dependency Web Components meta-framework. Every component you write is discoverable by AI agents and callable as a tool — in service of whatever you're building.">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Highlight.js — CSS first, then script at end of body -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/base16/solarized-dark.min.css" id="hljs-theme">
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./dist/docs.js"></script>
</head>
<body>
  <!-- ── Header ─────────────────────────────────────────────────── -->
  <header class="site-header">
    <div class="header-inner">
      <!-- Hamburger — wired by inline script below -->
      <button type="button" class="menu-toggle" id="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <svg viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <line x1="2" y1="4.5" x2="16" y2="4.5"/>
          <line x1="2" y1="9"   x2="16" y2="9"/>
          <line x1="2" y1="13.5" x2="16" y2="13.5"/>
        </svg>
      </button>

      <a href="#introduction" class="logo" aria-label="aihu — home">
        <img src="./aihu-wordmark.svg" alt="aihu" class="logo-mark" width="96" height="36">
        <span class="version" id="version-badge">v0</span>
      </a>

      <nav class="header-nav">
        <a href="https://github.com/fellwork/aihu" class="header-link">GitHub</a>
        <theme-toggle></theme-toggle>
      </nav>
    </div>
  </header>

  <!-- ── Sidebar backdrop (mobile) ──────────────────────────────── -->
  <div class="sidebar-backdrop" id="sidebar-backdrop" aria-hidden="true"></div>

  <!-- ── Hero ───────────────────────────────────────────────────── -->
  <section class="site-hero" aria-label="aihu — hero">
    <div class="hero-inner">
      <!-- Wordmark inline SVG so we can control dark/light ink -->
      <svg class="hero-wordmark" xmlns="http://www.w3.org/2000/svg" width="260" height="96" viewBox="0 0 380 140" fill="none" role="img" aria-label="aihu">
        <title>aihu</title>
        <g transform="translate(0,20)">
          <path d="M 18 30 L 18 56 a 32 32 0 0 0 64 0 L 82 30" stroke="#faf8f4" stroke-width="14" fill="none" stroke-linecap="butt"/>
          <circle cx="50" cy="16" r="9" fill="#c8543a"/>
        </g>
        <text x="128" y="100" font-family="Inter, Geist, ui-sans-serif, system-ui, sans-serif" font-size="84" font-weight="600" letter-spacing="-1.68" fill="#faf8f4">aihu</text>
      </svg>

      <p class="hero-tagline">The reactive web framework for modern TypeScript</p>

      <div class="hero-ctas">
        <a href="#/getting-started" class="btn btn-primary">Get Started</a>
        <a href="https://github.com/fellwork/aihu" class="btn btn-secondary" target="_blank" rel="noopener">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          View on GitHub
        </a>
      </div>
    </div>
  </section>

  <!-- ── Playground strip ─────────────────────────────────────────── -->
  <section class="hero-playground" aria-label="Try aihu in your browser">
    <div class="hero-playground-inner">
      <h2>Try it</h2>
      <p class="hero-playground-tagline">Edit. Compile. Inspect. All in your browser — powered by the WASM build of <code>aihu-compile</code>.</p>
      <playground-embed></playground-embed>
    </div>
  </section>

  <!-- ── Docs shell ──────────────────────────────────────────────── -->
  <docs-shell></docs-shell>

  <!-- ── Highlight.js (must come after content is in DOM) ──────── -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script>
    // Run once on initial load
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof hljs !== 'undefined') {
        hljs.configure({ ignoreUnescapedHTML: true });
        hljs.highlightAll();
      }
    });

    // Re-run after each SPA navigation (docs-shell fires hashchange)
    window.addEventListener('hashchange', () => {
      // Small tick to let the component update the DOM first
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          if (typeof hljs !== 'undefined') {
            document.querySelectorAll('pre code:not(.hljs)').forEach((block) => {
              hljs.highlightElement(block);
            });
          }
        });
      });
    });

    // Hamburger / mobile drawer logic
    var menuToggle    = document.getElementById('menu-toggle');
    var backdrop      = document.getElementById('sidebar-backdrop');

    function getNav() {
      // .docs-nav lives inside docs-shell's shadow root
      var shell = document.querySelector('docs-shell');
      return shell && shell.shadowRoot && shell.shadowRoot.querySelector('.docs-nav');
    }

    function openDrawer() {
      var nav = getNav();
      if (!nav) return;
      nav.classList.add('open');
      backdrop.classList.add('open');
      menuToggle.setAttribute('aria-expanded', 'true');
      document.body.style.overflow = 'hidden';
    }

    function closeDrawer() {
      var nav = getNav();
      if (!nav) return;
      nav.classList.remove('open');
      backdrop.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
      document.body.style.overflow = '';
    }

    menuToggle.addEventListener('click', () => {
      var nav = getNav();
      if (nav?.classList.contains('open')) {
        closeDrawer();
      } else {
        openDrawer();
      }
    });

    backdrop.addEventListener('click', closeDrawer);

    // Close drawer when a nav link is tapped on mobile.
    // Use composedPath() because e.target is retargeted to the shadow host
    // for events originating inside docs-shell's shadow DOM.
    document.addEventListener('click', (e) => {
      var path = e.composedPath();
      var isNavLink = path.some(function(el) { return el.classList && el.classList.contains('nav-link'); });
      if (isNavLink && window.innerWidth <= 768) {
        closeDrawer();
      }
    });

    // Inject version: try window.__AIHU_VERSION__ (set by build pipeline),
    // then fall back to fetching package.json, then static fallback.
    (() => {
      var badge = document.getElementById('version-badge');
      if (!badge) return;
      if (typeof window.__AIHU_VERSION__ !== 'undefined') {
        badge.textContent = `v${window.__AIHU_VERSION__}`;
        return;
      }
      fetch('./package.json')
        .then((r) => r.json())
        .then((pkg) => {
          if (pkg?.version) {
            badge.textContent = `v${pkg.version}`;
          }
        })
        .catch(() => { /* keep static v0 */ });
    })();
  </script>
</body>
</html>
